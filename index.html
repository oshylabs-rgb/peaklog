<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f17" />
<title>PeakLog</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<style>
:root{
  --bg:#0b0f17; --panel:#121826; --panel2:#0f1420; --line:#1f2937; --line2:#283449;
  --txt:#e6edf6; --mut:#8a97ad; --mut2:#5d6b82;
  --acc:#36d399; --acc2:#22d3ee; --warn:#fbbf24; --bad:#fb7185; --good:#34d399;
  --chip:#1b2435;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.45;overscroll-behavior-y:contain}
body{padding-bottom:78px}
h1,h2,h3{margin:0 0 .4em}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
a{color:var(--acc2)}
.wrap{max-width:680px;margin:0 auto;padding:14px 14px 8px}
.app-head{display:flex;align-items:center;gap:10px;padding:14px 14px 4px;max-width:680px;margin:0 auto}
.logo{font-weight:800;letter-spacing:.3px;font-size:20px}
.logo b{color:var(--acc)}
.app-head .date{margin-left:auto;color:var(--mut);font-size:13px;text-align:right}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.card h2{font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:700;overflow:hidden}
.card h2 .sub{float:right;text-transform:none;letter-spacing:0;color:var(--mut2);font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut2)}
.stat .v{font-size:21px;font-weight:800;margin-top:2px}
.stat .v small{font-size:12px;color:var(--mut);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--line2);
  border-radius:999px;padding:5px 11px;font-size:13px;color:var(--txt)}
.btn{background:var(--acc);color:#06281d;border:none;border-radius:11px;padding:11px 14px;font-weight:700;font-size:14px}
.btn:active{transform:translateY(1px)}
.btn.sec{background:transparent;color:var(--txt);border:1px solid var(--line2)}
.btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:9px}
.btn.warn{background:var(--warn);color:#3a2a00}
.btn.bad{background:transparent;color:var(--bad);border:1px solid #4a2230}
.btn.full{width:100%}
label.fld{display:block;margin:0 0 10px}
label.fld .lb{display:block;font-size:12px;color:var(--mut);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line2);color:var(--txt);
  border-radius:10px;padding:10px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:60px}
.check{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line);
  border-radius:11px;background:var(--panel2);margin-bottom:8px}
.check.done{border-color:#1f5a44;background:#0e1f1a}
.check .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line2);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-weight:900;color:transparent}
.check.done .box{background:var(--acc);border-color:var(--acc);color:#06281d}
.check .ti{font-weight:600}
.check .mt{font-size:12px;color:var(--mut)}
.check .tm{margin-left:auto;font-size:12px;color:var(--mut2);white-space:nowrap}
.bar{height:9px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.bar > i{display:block;height:100%;border-radius:6px;background:var(--acc)}
.bar.over > i{background:var(--bad)}
.bar.near > i{background:var(--warn)}
.muted{color:var(--mut)}
.small{font-size:12px}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--mut);border:1px solid var(--line)}
.flag{display:flex;gap:9px;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);margin-bottom:8px;font-size:14px}
.flag.ok{border-color:#1f5a44}.flag.ok .dot{background:var(--good)}
.flag.warn{border-color:#5a4a1f}.flag.warn .dot{background:var(--warn)}
.flag.bad{border-color:#5a2230}.flag.bad .dot{background:var(--bad)}
.flag .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:0 0 auto;background:var(--mut)}
.ex{border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:10px;background:var(--panel2)}
.ex .exh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ex .exh .nm{font-weight:700}
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 30px;gap:7px;align-items:center;margin-bottom:6px}
.setrow .si{color:var(--mut2);font-size:12px;text-align:center}
.setrow input{padding:8px 9px}
.x{background:transparent;border:none;color:var(--mut2);font-size:18px;line-height:1}
.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(11,15,23,.94);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;z-index:50;
  padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:none;color:var(--mut2);padding:9px 2px 8px;
  font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600}
.tabs button.on{color:var(--acc)}
.tabs .ic{font-size:19px;line-height:1}
.view{display:none}
.view.on{display:block}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line2);border-radius:11px;padding:3px;gap:3px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;white-space:nowrap;background:none;border:none;color:var(--mut);padding:8px 10px;border-radius:8px;font-weight:600;font-size:13px}
.seg button.on{background:var(--acc);color:#06281d}
.meal{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:none}
.meal .mn{font-weight:600}.meal .mm{font-size:12px;color:var(--mut)}
.meal .mk{margin-left:auto;font-weight:700;white-space:nowrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kvs{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.kvs b{color:var(--txt)}
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.daynav .d{flex:1;text-align:center;font-weight:700}
.daynav button{background:var(--panel2);border:1px solid var(--line2);color:var(--txt);border-radius:10px;padding:9px 13px;font-size:16px}
.plan-day{border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;background:var(--panel2)}
.plan-day.today{border-color:var(--acc)}
.plan-day .pd-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.plan-day .pd-h .dn{font-weight:800}
.plan-day .pd-h .tp{margin-left:auto;font-size:12px;color:var(--acc)}
.hint{font-size:12px;color:var(--mut2);margin-top:-4px;margin-bottom:12px}
.empty{text-align:center;color:var(--mut2);padding:22px 10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#0e1f1a;border:1px solid #1f5a44;
  color:var(--acc);padding:10px 16px;border-radius:12px;font-weight:600;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;font-size:14px}
.toast.show{opacity:1}
svg .gl{stroke:var(--line);stroke-width:1}
svg .ln{fill:none;stroke-width:2.5}
svg text{fill:var(--mut2);font-size:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
hr.sep{border:none;border-top:1px solid var(--line);margin:12px 0}
.addmeal{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1fr;gap:7px;align-items:end}
.addmeal .lb{font-size:10px}
@media(max-width:560px){.addmeal{grid-template-columns:1fr 1fr;gap:7px}}
.foodchip{display:inline-block;background:var(--chip);border:1px solid var(--line2);border-radius:9px;padding:7px 10px;margin:0 6px 6px 0;font-size:13px}
.foodchip b{color:var(--acc)}
.step{display:grid;grid-template-columns:82px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:none}
.step .st{font-size:12px;color:var(--acc);font-weight:700;padding-top:2px;line-height:1.35}
.step .sd{font-size:14px}
.step .sg{font-size:12px;color:var(--mut);margin-top:3px}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:9px 0}
.spec .sp{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.spec .sp .k{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut2)}
.spec .sp .v{font-weight:700;font-size:14px;margin-top:1px}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ztab{width:100%;border-collapse:collapse;font-size:13px}
.ztab td,.ztab th{padding:7px 8px 7px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
.ztab td.wrap{white-space:normal}
.ztab th{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut2);font-weight:700}
.ztab tr.hi td{color:var(--acc);font-weight:700}
.sesh{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:11px;background:var(--panel2)}
.sesh .sh{display:flex;align-items:baseline;gap:8px;margin-bottom:3px;flex-wrap:wrap}
.sesh .sh .nm{font-weight:800;font-size:15px}
.sesh .sh .wh{margin-left:auto;font-size:12px;color:var(--acc)}
.sublab{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut2);font-weight:700;margin:12px 0 5px}
ul.tight{margin:4px 0 0;padding-left:17px}
ul.tight li{margin-bottom:4px;font-size:13px;color:var(--mut)}
ul.tight li b{color:var(--txt)}
/* workout module (session screen) */
.wsclock{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.wsrow{border:1px solid var(--line);border-radius:11px;background:var(--panel2);padding:9px 10px;margin-bottom:8px;cursor:pointer}
.wsrow.done{border-color:#1f5a44;background:#0e1f1a;cursor:default}
.wsrow.skip{opacity:.55;cursor:default}
.wsrow .top{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.wsrow .nm{font-weight:700}
.wsrow .prev{margin-left:auto;color:var(--mut2);font-size:12px;white-space:nowrap}
.wsctl{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.wsctl .stepv{min-width:60px;text-align:center;font-weight:800}
.stepbtn{background:var(--panel);border:1px solid var(--line2);color:var(--txt);border-radius:10px;min-width:46px;min-height:44px;padding:0 12px;font-weight:800;font-size:18px}
.exb{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px;margin-bottom:10px}
.exb.open{border-color:var(--acc2);background:var(--panel)}
.pill.ok{border-color:#1f5a44;color:var(--acc)}
input[type=number].wsw{width:92px;flex:0 0 92px;text-align:center;font-weight:800;font-size:18px;padding:9px 6px}
.sets{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 8px}
.setb{min-width:58px;min-height:48px;padding:0 12px;border-radius:12px;border:2px solid var(--line2);background:var(--panel2);color:var(--txt);font-weight:800;font-size:18px}
.setb.next{border-color:var(--acc2);color:var(--acc2)}
.setb.done{background:#0e1f1a;border-color:var(--acc);color:var(--acc)}
.setb.skip{opacity:.4}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chip{min-width:46px;min-height:44px;padding:0 4px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);color:var(--mut);font-weight:700;font-size:16px}
.chip.hit{color:var(--txt);border-color:var(--line2)}
.chip.sug{border-color:var(--acc2);color:var(--acc2)}
.confirmbtn{margin-left:auto;background:var(--acc);color:#06281d;border:none;border-radius:9px;padding:8px 14px;font-weight:800;font-size:15px}
</style>
</head>
<body>
<div class="app-head">
  <div class="logo">Peak<b>Log</b></div>
  <div class="date" id="headDate"></div>
</div>
<div class="wrap" id="root"></div>

<div class="tabs" id="tabs"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   PeakLog — local-first personal health tracker (no build, no backend)
   Data: localStorage key 'peaklog.v1'. Export/import as JSON.
   ============================================================ */

/* ---------- date helpers (CET week, Monday start) ---------- */
const pad=n=>String(n).padStart(2,"0");
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
function parseISO(s){const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c);}
function addDays(iso,n){const d=parseISO(iso);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function dow(iso){return (parseISO(iso).getDay()+6)%7;} // 0=Mon..6=Sun
function mondayOf(iso){return addDays(iso,-dow(iso));}
function fmtNice(iso){const d=parseISO(iso);return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});}
const DOW_NAMES=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
function daysBetween(a,b){return Math.round((parseISO(b)-parseISO(a))/86400000);}

/* ---------- seeds (from project memory + InBody 10 Jun 2026) ---------- */
// 4-week muscle block: 16 Jul → 12 Aug 2026. Lean-gain target ≈ +0.25-0.4 kg/wk.
const GOAL={date:"2026-08-12",bf:null,label:"4-week muscle block — bigger chest/arms/shoulders by 12 Aug 2026"};

const BASELINE={ // InBody 580, 10 Jun 2026
  date:"2026-06-10", weight:79.4, bodyFat:13.4, fatMass:10.6, smm:39.5, ffm:68.8,
  bmi:25.6, vfa:46.1, vfl:4, bmr:1856, whr:0.88, score:91
};
// lean-bulk landing zone: ~+1.3kg over the 4-week block
const TARGET_WEIGHT=+(BASELINE.weight+1.3).toFixed(1); // ~80.7
const BULK_RATE={lo:0.15, hi:0.5}; // healthy kg/week gain band — above hi is mostly fat

// Lean-bulk macros: BMR 1856 → TDEE ~2450 with 6 lifting days; ~+200 surplus.
// carbs fuel the sessions now — the keto cut is paused for this block.
const TARGETS={kcal:2650, protein:180, netCarbs:290, netCarbCeiling:340, fat:80, water:3000,
  windowStart:"10:00", windowEnd:"20:00", fastHours:14};

/* ---------- phase plan (structured — add future phases to this array) ----------
   Each phase: start/end (ISO), label, daily macro targets, fasting protocol,
   weekly split (lift:true days accept the volumeIncrease flag). Read-only
   reference — sessions are logged in the Workout tab as usual. */
const PHASES=[
  {id:"p1", label:"Fat Loss Sprint", start:"2026-07-16", end:"2026-08-07", mode:"cut",
    targets:{kcal:2000, protein:195, fat:130, carbs:20, carbCeiling:30},
    window:{windowStart:"12:00", windowEnd:"18:00", fastHours:18},
    fasting:"Weekdays 12:00–18:00 eating window · Sunday extended fast 20-24h, ending 19:00",
    volumeIncrease:false,
    split:[{d:"Mon",s:"Push A + Z2 row",lift:true},{d:"Tue",s:"Pull A + Z2 walk",lift:true},{d:"Wed",s:"Legs A + Core A",lift:true},
           {d:"Thu",s:"Push B + Z2 row",lift:true},{d:"Fri",s:"Pull B + Z2 walk",lift:true},
           {d:"Sat",s:"Legs B + Core B",lift:true},{d:"Sun",s:"Rest + fast",lift:false}]},
  {id:"p2", label:"Hold and Nudge", start:"2026-08-08", end:"2026-09-03", mode:"hold",
    targets:{kcal:2350, protein:195, fat:110, carbs:145, carbCeiling:170},
    window:{windowStart:"12:00", windowEnd:"19:00", fastHours:16},
    fasting:"Standard 16:8 — 12:00 to 19:00",
    volumeIncrease:true,
    split:[{d:"Mon",s:"Push A + Z2 row",lift:true},{d:"Tue",s:"Pull A + Z2 walk",lift:true},{d:"Wed",s:"Legs A + Core A",lift:true},
           {d:"Thu",s:"Push B + Z2 row",lift:true},{d:"Fri",s:"Pull B + Z2 walk",lift:true},
           {d:"Sat",s:"Legs B + Core B",lift:true},{d:"Sun",s:"Rest + fast",lift:false}]}
];
const PHASE_START_BODY={date:"2026-07-16", weight:80, bodyFat:null, note:"Phase 1 start — Fat Loss Sprint"};
function activePhase(date){return PHASES.find(p=>date>=p.start&&date<=p.end)||null;}
// the active phase drives the operative nutrition targets; manual edits on the
// Plan tab persist until the phase changes (keyed by S.appliedPhase)
function applyPhaseTargets(){
  const p=activePhase(todayISO());
  if(!p||S.appliedPhase===p.id)return;
  Object.assign(S.targets,{kcal:p.targets.kcal,protein:p.targets.protein,fat:p.targets.fat,
    netCarbs:p.targets.carbs,netCarbCeiling:p.targets.carbCeiling},p.window||{});
  S.appliedPhase=p.id;save();
}

/* The lift days are no longer a fixed template: the rotation (WM_BLOCKS, below
   the workout module) defines them and tplFor(date) turns the rotation's day into
   the shape the Workout tab logs. The 4-week PPL block (16 Jul → 12 Aug 2026) and
   its "DB RDL" are retired; anything logged under them stays in S.workouts. */
// program-wide guidance, surfaced on the Plan tab
const PLAN_RULES={
  increments:"DB +2 kg · machines/cables +2.5-5 kg · barbell +2.5 kg · added-bodyweight +2.5 kg",
  rules:[
    "35-minute cap: 13 working sets, 90s rest on compound lifts, 60s on isolation. Running long? Cut rest, not sets.",
    "Effort: the last set of every lift ends at 0-2 reps in the tank. Could do 3 more clean? Too light.",
    "Double progression: stay at a fixed weight, hit the top of the rep range on all sets, then add the increment next session. In a surplus you should be moving up most weeks.",
    "These weights are starting points. >2 reps in the tank → jump an increment and log the real number; can't hit the bottom of the range with good form → drop one increment.",
    "Eat to grow: hit the calorie and protein targets daily. If weight isn't rising after a full week, add ~150 kcal (carbs).",
    "Gaining faster than ~0.5 kg/week means mostly fat — pull ~150 kcal back."
  ]
};

/* ---------- 5-week progressive cut (separate, standalone reference plan) ----------
   Standard commercial gym only: rowing machine (erg), treadmill, and the weights
   floor (machines / dumbbells / barbell). A 5-week cut that keeps the same 6-day
   training week throughout while the cardio volume and the deficit ramp week to
   week (base → build → push → peak → finish), stripping subcutaneous fat while the
   weights hold onto muscle. Read-only reference — this does NOT change the logged
   Workout tab or the phase nutrition targets. */
const CUT_PLAN={
  title:"5-Week Progressive Cut",
  sub:"Rower · Treadmill · Weights",
  frame:"5 weeks, 6 sessions a week, standard gym only. The training week stays the same; the cardio volume and the calorie deficit escalate each week (see the progression). You can't spot-reduce, so it's the ramping whole-body deficit that pulls subcutaneous fat off — the weights keep the muscle so you end up leaner, not just smaller. Realistic over five weeks is ~3–5 kg and a visibly tighter waist, deficit-driven.",
  cycleNote:"Same 7-day week every week — only the cardio length and the deficit change. Ramp weeks 1→4, then ease the intensity in week 5 so fatigue and water drop and the leanness shows.",
  weeks:[
    {wk:"Week 1",theme:"Base — set the deficit",deficit:"~400–500 kcal under maintenance",cardio:"Intervals ~15 min · Zone-2 row 25 min · long walk 30 min",note:"Ease in. Groove the routine, lock protein ≥2 g/kg, don't red-line yet."},
    {wk:"Week 2",theme:"Build",deficit:"~500 kcal",cardio:"Intervals ~18 min · Zone-2 row 30 min · long walk 40 min",note:"Add a little volume everywhere. Weights stay heavy to hold muscle."},
    {wk:"Week 3",theme:"Push",deficit:"~500–600 kcal",cardio:"Intervals ~22 min · Zone-2 row 35 min · long walk 45 min",note:"Cardio steps up. If the scale stalls 5+ days, tighten the diet before adding more cardio."},
    {wk:"Week 4",theme:"Peak — highest output",deficit:"~600–750 kcal",cardio:"Intervals ~25 min · Zone-2 row 40 min · long walk 60 min · optional AM walk",note:"The hardest week. Extra low-intensity steps do the heavy lifting — watch recovery and sleep."},
    {wk:"Week 5",theme:"Finish & reveal — ease off",deficit:"~500 kcal",cardio:"One short HIIT only · keep Zone-2 row 30 min · keep 10k+ steps",note:"Pull the hard intervals back so fatigue and water clear and the leanness shows. Reassess at the end — hold or re-run from week 1."}
  ],
  rules:[
    "Deficit is the lever, and it ramps: ~400–500 kcal under in week 1 up to ~600–750 by week 4, then back to ~500 in week 5. Keep protein ≥2 g/kg the whole way to protect muscle.",
    "Cardio escalates, weights hold: keep the lifts heavy across all 5 weeks — that's what keeps the muscle so the fat loss reads as leaner, not smaller.",
    "Weights first, cardio second on lifting days — lift while fresh.",
    "Rower intervals: hard 250–500 m pushes with an easy paddle between. Chase watts, not just minutes; extend the total as the weeks progress.",

/* ---------- exercise library ----------

   70% of that, rounded to 2.5, or to roundKg for light dumbbells). Every loaded
   lift scales with the InBody lean body mass; only unloaded bodyweight moves
   keep startKg 0. Session-1 progression takes over from the estimate.
   perHand = the number is per dumbbell. incrementKg: 2.5 upper, 5 lower
   (DB moves stay 2.5 — that's the rack). repRange = the default range; a
   rotation block can override it per slot (WM_BLOCKS).
   mg = muscle group (feeds the Workout tab and the weekly review).
   posture = upper-back / rear-delt / glute / hinge / carry work that fixes
   desk posture UNDER LOAD — it lives inside the lift days, no extra day.
   unit "s" = the reps box holds seconds (carries); repStep = stepper size.
   bwBased = the load is added to bodyweight (strength maths adds bodyweight).
   noE1RM = left out of the strength-trend maths (core, timed work).
   seedFrom = no history of its own yet → start from this lift's logged numbers.
   retired = no longer programmed; kept so logged history still resolves. */

   (heavy, low reps) raises the ceiling every later block works under; VOLUME
   (lighter, higher reps, joint-friendlier variations) harvests the strength with
   less spinal load. Each block is 5 loading weeks + 1 deload. Squat, deadlift,
   press and pull stay in every block (the anchors); the variations rotate.

    sessions:{},setLogs:[],cardioLogs:[],activeSessionId:null,rowerPaceSec:null,

/* ---------- phase reads (integration point A — read-only) ---------- */
function wmPhase2(date){const p=activePhase(date);return !!(p&&p.volumeIncrease);}
// Sunday fast flag comes from the existing phase config (the split's Sunday
// entry / fasting text) — the module never stores its own copy.
function wmIsFastDay(date){
  if(dow(date)!==6)return false;
  const p=activePhase(date);if(!p)return false;
  const sun=p.split&&p.split[6];
  return !!(sun&&/fast/i.test(sun.s||""))||/fast/i.test(p.fasting||"");
}
function wmCanStart(day,date){
  if(wmIsFastDay(date)&&!day.fastDayAllowed)return false;   // fast day: rest or flat Z2 only
  if(day.type==="treadmill_hiit"&&!wmPhase2(date))return false; // HIIT unlocks in Phase 2
  return true;
}
function wmSets(pe,date){return pe.sets+(wmPhase2(date)?1:0);} // Phase 2: +1 set per exercise

/* ---------- rotation: which block and week is a date in? ----------
   S.wm.rotation.anchors = [{startDate, startBlock}] sorted by date. The week
   starting at an anchor's (Monday) startDate is week 1 of block number startBlock,
   cycling Build → Strength → Volume; it runs on from there until the next anchor.
   "Start next block now" appends an anchor, so weeks already done keep the
   labels they had. Dates before the first anchor are pre-rotation (the frozen
   week). Week 6 of every block is the deload. */
function wmBlockAt(date){
  const r=S.wm&&S.wm.rotation,mon=mondayOf(date);
  const a=r&&r.anchors&&r.anchors.filter(x=>x.startDate<=mon).pop();
  if(!a)return null;
  const n=WM_BLOCK_ORDER.length,W=WM_BLOCK_WEEKS;
  const wk=Math.round(daysBetween(a.startDate,mon)/7);
  const abs=(a.startBlock||0)+Math.floor(wk/W);
  const week=wk%W+1;
  const startDate=addDays(a.startDate,Math.floor(wk/W)*W*7);
  return {block:WM_BLOCKS[WM_BLOCK_ORDER[((abs%n)+n)%n]],index:abs,week:week,weeks:W,deload:week===W,
    half:week<=WM_HALF_WEEKS?"A":"B",
    startDate:startDate,endDate:addDays(startDate,W*7-1),
    next:WM_BLOCKS[WM_BLOCK_ORDER[(((abs+1)%n)+n)%n]]};
}
// the week's rest day: "sun" or "fri" (alternating from the first rotation week), or "both"; the lifter can override
function wmDefaultRest(mon){
  const a=S.wm.rotation&&S.wm.rotation.anchors&&S.wm.rotation.anchors[0];
  const k=a?Math.round(daysBetween(a.startDate,mon)/7):0;
  return ((k%2)+2)%2===0?"sun":"fri";
}
function wmRestKind(mon){
  const ov=S.wm.restOverride&&S.wm.restOverride[mon];
  return (ov==="sun"||ov==="fri"||ov==="both")?ov:wmDefaultRest(mon);
}
function wmSetRest(mon,kind){ // pick a week's rest day; choosing the default again clears the override
  S.wm.restOverride=S.wm.restOverride||{};
  if(kind===wmDefaultRest(mon))delete S.wm.restOverride[mon];else S.wm.restOverride[mon]=kind;
  save();
}
// the layout in force on a date, e.g. {half:"B",rest:"fri",days:[…Mon..Sun plan ids]}
function wmLayoutFor(date){
  const b=wmBlockAt(date);if(!b)return null;
  const rest=wmRestKind(mondayOf(date));
  return {half:b.half,rest:rest,days:WM_LAYOUTS[b.half][rest]};
}
// which programme day falls on a date: the week's layout once the rotation has begun, the old week before
function wmDayIdFor(date){const L=wmLayoutFor(date);return (L?L.days:WM_WEEK)[dow(date)];}
// the day to do on `date`: lift days come from the active block; the Sunday rest day is relabelled
// (it was "Fast day" under the cut phases)
function wmDay(dayId,date){
  const base=WM_DAYS[dayId];
  if(base&&(dayId==="sunRest"||dayId==="restDay")&&wmBlockAt(date))return Object.assign({},base,{label:"Rest day — recovery"});
  if(!base||base.type!=="lift")return base;
  const b=wmBlockAt(date);
  const plan=b&&b.block.days[dayId];
  if(!plan)return base; // before the rotation began → the frozen week
  return Object.assign({},base,{label:plan.label,blockId:b.block.id,week:b.week,deload:b.deload,
    exercises:plan.ex.map(pe=>Object.assign({},pe,{sets:Math.max(2,pe.sets-(b.deload?1:0))}))});
}
// a session keeps the plan it started with, so editing the programme never rewrites what was done
function wmSessionDay(sess){
  const base=WM_DAYS[sess.programmeDayId];
  if(sess.plan)return Object.assign({},base,{label:sess.label||base.label,blockId:sess.blockId,week:sess.week,
    deload:!!sess.deload,exercises:sess.plan});
  return wmDay(sess.programmeDayId,sess.date);
}
function wmRange(pe,ex){return (pe&&pe.repRange)||ex.repRange;}
function wmRangeLabel(ex,range){range=range||ex.repRange;return range[0]+"–"+range[1]+(ex.unit==="s"?" s":" reps");}

/* ---------- weight prescription engine ---------- */
function wmEx(id){return WM_EXERCISES.find(e=>e.id===id);}
function wmLBM(ib){return ib.weightKg*(1-ib.bodyFatPct/100);}
function wmRound(kg,step){step=step||2.5;return Math.round(kg/step)*step;}
// conservative start: est 1RM = LBM × multiplier, work at 70% of that
function wmEstimateKg(ex,ib){
  if(ex.lbmMult==null)return ex.startKg||0;
  let w=wmLBM(ib)*ex.lbmMult*0.7;
  if(ex.perHand)w/=2;
  return Math.max(0,wmRound(w,ex.roundKg));
}
// strength maths: Epley estimated 1RM (reps capped at 15), bodyweight added for pull-ups and dips
function wmBodyKg(){return num(S.wm.inbody.weightKg,78);}
function wmEffKg(ex,kg){return ex&&ex.bwBased?wmBodyKg()+num(kg):num(kg);}
function wmE1RM(kg,reps){return kg*(1+Math.min(num(reps),15)/30);}
function wmBestE1RM(ex,logs){return Math.max(0,...logs.map(l=>wmE1RM(wmEffKg(ex,l.weightKg),l.reps)));}
// the load that lands at the bottom of `range` with ~2 reps in reserve, given an e1RM
function wmLoadFromE1RM(ex,e1rm,range){
  const eff=e1rm/(1+(range[0]+2)/30);
  return Math.max(0,wmRound(ex.bwBased?eff-wmBodyKg():eff));
}
function wmSameRange(a,b){return !!a&&!!b&&a[0]===b[0]&&a[1]===b[1];}
// ended sessions that hold performed (non-skipped) sets of this exercise, oldest first.
// Deload sessions never feed progression; each session carries the rep range it was done at.
function wmSessionsFor(exId){
  const ex=wmEx(exId);
  const by={};
  S.wm.setLogs.forEach(l=>{if(l.exerciseId===exId&&!l.skipped)(by[l.sessionId]=by[l.sessionId]||[]).push(l);});
  return Object.keys(by)
    .map(id=>({sess:S.wm.sessions[id],logs:by[id].slice().sort((a,b)=>a.setIndex-b.setIndex)}))
    .filter(x=>x.sess&&x.sess.endedAt&&!x.sess.deload)
    .map(x=>{x.range=x.logs[0].range||(ex?ex.repRange:null);return x;})
    .sort((a,b)=>a.sess.startedAt<b.sess.startedAt?-1:1);
}
/* No history → carried over from a related lift if one is logged (RDL → stiff-leg
   deadlift, back squat → front squat), else the InBody estimate (calibration; adjust
   freely, the engine re-anchors to what was actually logged). With history the logs
   govern — a new scan re-baselines estimates but never drags earned progression down.
   Same rep range as last time: double progression — top of range on all sets two
   sessions running → +increment; below the bottom two sessions running → deload 10%.
   Different rep range (a new block): re-set the load from the last session's estimated
   1RM so 12-rep weights don't get used for 5s. opts.deload = the block's deload week. */
function wmPrescription(exId,range,opts){
  const ex=wmEx(exId);
  range=range||ex.repRange;
  const hist=wmSessionsFor(exId);
  let res;
  if(!hist.length){
    const sf=ex.seedFrom,src=sf&&wmEx(sf.id),sh=src?wmSessionsFor(src.id):[];
    if(sh.length&&!ex.noE1RM)
      res={kg:wmLoadFromE1RM(ex,wmBestE1RM(src,sh[sh.length-1].logs)*sf.ratio,range),why:"carried",from:src.name};
    else res={kg:wmEstimateKg(ex,S.wm.inbody),why:"calibration"};
  } else {
    const last=hist[hist.length-1];
    const anchor=Math.max(...last.logs.map(l=>num(l.weightKg)));
    if(!wmSameRange(last.range,range)){
      res=ex.noE1RM?{kg:anchor,why:"hold"}:{kg:wmLoadFromE1RM(ex,wmBestE1RM(ex,last.logs),range),why:"converted"};
    } else {
      let kg=anchor,why="hold";
      const prev=hist.length>=2&&wmSameRange(hist[hist.length-2].range,range)?hist[hist.length-2]:null;
      if(prev){
        const topAll=x=>x.logs.length&&x.logs.every(l=>num(l.reps)>=range[1]);
        const below=x=>x.logs.some(l=>num(l.reps)<range[0]);
        if(topAll(last)&&topAll(prev)){kg=anchor+ex.incrementKg;why="progress";}
        else if(below(last)&&below(prev)){kg=wmRound(anchor*0.9);why="deload";}
      }
      res={kg,why};
    }
  }
  if(opts&&opts.deload&&res.kg>0)res={kg:wmRound(res.kg*0.9),why:"deloadweek"};
  return res;
}
function wmWhyLabel(w,from){return w==="progress"?"↑ progressed":w==="deload"?"↓ deload −10%":w==="deloadweek"?"deload week −10%":
  w==="converted"?"re-set for this block's reps":w==="carried"?("carried over from "+(from||"your last lift")):
  w==="calibration"?"from your InBody — adjust freely":"hold";}
function wmKgLabel(ex,kg){
  kg=num(kg);
  if(ex.equipment==="bodyweight")return kg>0?("BW+"+round(kg,1)+"kg"):"BW";
  return round(kg,1)+"kg"+(ex.perHand?"/hand":"");
}

/* ---------- rower pace targeting ----------
   Seed 2:00–2:10 /500m. After a session: next target = avg of the session's
   interval paces − 1 s, floor 1:50 — but only if ALL intervals were completed
   within 5 s of the current target. */
function wmRowerTargetSec(){return S.wm.rowerPaceSec||(WM_ROWER_SEED.lo+WM_ROWER_SEED.hi)/2;}
function wmPaceStr(sec){sec=Math.round(sec);return Math.floor(sec/60)+":"+pad(sec%60);}
function wmRowerTargetLabel(){return S.wm.rowerPaceSec?wmPaceStr(S.wm.rowerPaceSec)+" /500m":"2:00–2:10 /500m (seed)";}
function wmNextRowerTarget(times,targetSec,need){
  if(!times||times.length<need)return null;
  if(!times.every(t=>Math.abs(t-targetSec)<=5))return null;
  const avg=times.reduce((a,b)=>a+b,0)/times.length;
  return Math.max(WM_ROWER_FLOOR,Math.round(avg)-1);
}
function wmParseTime(v){
  v=String(v==null?"":v).trim();
  if(!v)return null;
  if(/^\d+:\d{1,2}(\.\d+)?$/.test(v)){const[m,s]=v.split(":");return +m*60+parseFloat(s);}
  const n=parseFloat(v);return isFinite(n)?n:null;
}

/* ---------- session lifecycle ---------- */
// consecutive exercises sharing a supersetGroup form one group; everything else is a group of one
function wmGroups(day){
  const groups=[];
  (day.exercises||[]).forEach(pe=>{
    const g=groups[groups.length-1];
    if(pe.supersetGroup&&g&&g.key===pe.supersetGroup)g.list.push(pe);
    else groups.push({key:pe.supersetGroup||null,list:[pe]});
  });
  return groups;
}
function wmSetQueue(day,date){ // set rows in superset order (A1,B1,A2,B2…)
  if(!day.exercises)return[];
  const items=[],groups=wmGroups(day);
  groups.forEach(g=>{
    const rounds=Math.max(...g.list.map(pe=>wmSets(pe,date)));
    for(let si=0;si<rounds;si++)g.list.forEach(pe=>{if(si<wmSets(pe,date))items.push({pe,setIndex:si});});
  });
  return items;
}
function wmCreateSession(dayId,date){
  const id="ws-"+date+"-"+Date.now().toString(36);
  const day=wmDay(dayId,date);
  S.wm.sessions[id]={id,date,programmeDayId:dayId,startedAt:new Date().toISOString(),endedAt:null,isFastDay:wmIsFastDay(date),
    blockId:day.blockId||null,week:day.week||null,deload:!!day.deload,label:day.label,
    plan:day.type==="lift"?day.exercises.map(pe=>Object.assign({},pe)):null};
  S.wm.activeSessionId=id;save();return id;
}
function wmStartSession(dayId){
  const date=todayISO();const day=wmDay(dayId,date);
  if(!wmCanStart(day,date)){
    toast(wmIsFastDay(date)&&!day.fastDayAllowed?"Fast day — rest or flat Z2 only":"HIIT unlocks in Phase 2");
    return;
  }
  const act=S.wm.activeSessionId&&S.wm.sessions[S.wm.activeSessionId];
  if(act&&!act.endedAt){route="wmsession";render();return;} // resume, don't stack
  wmCreateSession(dayId,date);wmDrafts={};wmRestUntil=0;wmUI={sess:null,open:null,shown:null};
  route="wmsession";render();
}
function wmLoggedSet(sid,exId,si){return S.wm.setLogs.find(l=>l.sessionId===sid&&l.exerciseId===exId&&l.setIndex===si);}
function wmElapsedSec(sess){return Math.max(0,(Date.now()-Date.parse(sess.startedAt))/1000);}
// end a lift session: anything not logged is flagged skipped (45-min cap rule)
function wmFlagRemaining(sess){
  const day=wmSessionDay(sess);
  if(day.type==="lift"){
    wmSetQueue(day,sess.date).forEach(q=>{
      if(!wmLoggedSet(sess.id,q.pe.exerciseId,q.setIndex))
        S.wm.setLogs.push({sessionId:sess.id,exerciseId:q.pe.exerciseId,setIndex:q.setIndex,
          weightKg:0,reps:0,timestamp:new Date().toISOString(),skipped:true});
    });
  }

}
function wmSessionVolume(sess){
  let v=0;S.wm.setLogs.forEach(l=>{if(l.sessionId===sess.id&&!l.skipped)v+=num(l.weightKg)*num(l.reps);});
  return v;
}
function wmPrevSet(exId,setIndex){ // last session's matching set, for the greyed "prev" hint
  const h=wmSessionsFor(exId);
  if(!h.length)return null;
  const logs=h[h.length-1].logs;
  return logs.find(l=>l.setIndex===setIndex)||logs[logs.length-1]||null;
}

/* ---------- fast logging ----------
   Everything the session screen does on a tap, kept free of the DOM so it is testable.
   A set is logged at the weight shown on its exercise card (a typed/stepped draft, else the
   weight already used this session, else the prescription) and a rep count the lifter picks —
   or, when they just tap the set, the suggestion: what they did on the previous set this
   session, else the same set last session, else the bottom of the range. */
function wmLogsFor(sid,exId){return S.wm.setLogs.filter(l=>l.sessionId===sid&&l.exerciseId===exId&&!l.skipped);}
function wmNextSet(sess,pe){ // first set of this exercise not yet logged, or -1
  const n=wmSets(pe,sess.date);
  for(let i=0;i<n;i++)if(!wmLoggedSet(sess.id,pe.exerciseId,i))return i;
  return -1;
}
function wmGroupDone(sess,g){return g.list.every(pe=>wmNextSet(sess,pe)<0);}
function wmWeightFor(sess,pe){
  const ex=wmEx(pe.exerciseId),d=wmDrafts["w:"+ex.id];
  if(d!=null&&isFinite(d))return num(d);
  const mine=wmLogsFor(sess.id,ex.id);
  if(mine.length)return num(mine[mine.length-1].weightKg);
  return wmPrescription(ex.id,wmRange(pe,ex),{deload:!!sess.deload}).kg;
}
function wmSuggestReps(sess,pe,setIndex){
  const ex=wmEx(pe.exerciseId),range=wmRange(pe,ex),mine=wmLogsFor(sess.id,ex.id);
  if(mine.length)return num(mine[mine.length-1].reps);
  const prev=wmPrevSet(ex.id,setIndex);
  if(prev&&wmSameRange(prev.range||ex.repRange,range))return num(prev.reps);

// the rep counts offered as one-tap buttons: a step under the range up to a step over it
function wmRepChips(ex,range){
  const st=ex.repStep||1,out=[];

  return out;
}
function wmLogSet(sess,pe,setIndex,kg,reps){
  const ex=wmEx(pe.exerciseId),range=wmRange(pe,ex);
  S.wm.setLogs=S.wm.setLogs.filter(l=>!(l.sessionId===sess.id&&l.exerciseId===ex.id&&l.setIndex===setIndex));
  S.wm.setLogs.push({sessionId:sess.id,exerciseId:ex.id,setIndex:setIndex,weightKg:num(kg),reps:num(reps),
    range:range.slice(),timestamp:new Date().toISOString()});

}
function wmUndoSet(sess,exId,setIndex){
  const n=S.wm.setLogs.length;
  S.wm.setLogs=S.wm.setLogs.filter(l=>!(l.sessionId===sess.id&&l.exerciseId===exId&&l.setIndex===setIndex&&!l.skipped));
  if(S.wm.setLogs.length!==n)save();

    const l=S.wm.setLogs[i];

  }
  return null;

function wmLogRemaining(sess,pes,reps){
  let n=0;
  pes.forEach(pe=>{

    for(let i=0;i<wmSets(pe,sess.date);i++){
      if(wmLoggedSet(sess.id,pe.exerciseId,i))continue;
      wmLogSet(sess,pe,i,w,reps!=null?reps:wmSuggestReps(sess,pe,i));n++;
    }
  });
  return n;
}

function load(){

    if((o.planRev||0)<10){try{const bk=KEY+".bak-planRev"+(o.planRev||0);if(localStorage.getItem(bk)==null)localStorage.setItem(bk,r);}catch(e){}}

function migrate(o){ // forward-compatible defaults

  if(o.wm.activeSessionId===undefined)o.wm.activeSessionId=null;
  if(o.wm.rowerPaceSec===undefined)o.wm.rowerPaceSec=null;
  // rotation: the 6-week block cycle starts the week this version first opens; nothing logged is touched
  if(!o.wm.rotation||!Array.isArray(o.wm.rotation.anchors)||!o.wm.rotation.anchors.length)
    o.wm.rotation={anchors:[{startDate:mondayOf(todayISO()),startBlock:0}]};

    o.planRev=2;
  }
  if(o.planRev<3){
    // adopted the "Summer Log" PDF plan — refresh untouched today/future sessions
    const today=todayISO();
    for(const d in o.workouts){if(d>=today&&isPristine(o.workouts[d]))delete o.workouts[d];}
    o.planRev=3;
  }
  if(o.planRev<4){
    // 4-week muscle block: new PPL split, lean-bulk diet replaces the keto cut
    const today=todayISO();
    for(const d in o.workouts){if(d>=today&&isPristine(o.workouts[d]))delete o.workouts[d];}
    o.targets=Object.assign({},TARGETS);          // adopt bulk macros (kcal/carbs up, fat down)
    o.profile.goalDate=GOAL.date;                  // 12 Aug 2026 block end
    BULK_FOODS.forEach(f=>{if(!o.myFoods.some(x=>x.name===f.name))o.myFoods.push(f);});
    o.planRev=4;
  }
  if(o.planRev<5){
    // phase plan: seed the Phase 1 starting body point (80kg, 16 Jul 2026) into the existing bodyLog
    if(!o.bodyLog.some(b=>b.date===PHASE_START_BODY.date))o.bodyLog.push(Object.assign({},PHASE_START_BODY));
    o.bodyLog.sort((a,b)=>a.date<b.date?-1:1);
    o.planRev=5;
  }
  if(o.planRev<6){
    // core finishers added to the two leg days — refresh untouched today/future sessions
    const today=todayISO();
    for(const d in o.workouts){if(d>=today&&isPristine(o.workouts[d]))delete o.workouts[d];}
    o.planRev=6;
  }
  if(o.planRev<7){
    // Zone 2 cardio bolted onto the four upper days — refresh untouched today/future sessions
    const today=todayISO();
    for(const d in o.workouts){if(d>=today&&isPristine(o.workouts[d]))delete o.workouts[d];}
    o.planRev=7;
  }
  if(o.planRev<8){
    // rotation + deadlifts + loaded posture work: untouched today/future Workout-tab days rebuild from
    // the rotation. Anything with a logged rep, note, RPE or cardio minute is left exactly as it was.
    const today=todayISO();
    for(const d in o.workouts){if(d>=today&&isPristine(o.workouts[d]))delete o.workouts[d];}
    // a session already in progress finishes the plan it started with
    for(const id in o.wm.sessions){
      const s=o.wm.sessions[id],base=WM_DAYS[s.programmeDayId];
      if(!s.endedAt&&!s.plan&&base&&base.type==="lift"){s.plan=base.exercises.map(pe=>Object.assign({},pe));s.label=base.label;}
    }
    o.planRev=8;
  }
  if(o.planRev<9){
    // six lifting days (Tue Pull A, Thu Push B) replace the cardio-only days: Workout-tab days that were
    // cached empty and never touched rebuild with exercises and weights. Logged days are left alone.
    const today=todayISO();
    for(const d in o.workouts){if(d>=today&&isPristine(o.workouts[d]))delete o.workouts[d];}
    o.planRev=9;
  }
  if(o.planRev<10){
    // legs three times a week and a Friday/Sunday rest day: the weekly layout changed, so Workout-tab
    // days that were cached from the old layout and never touched rebuild. Logged days stay as they were.
    const today=todayISO();
    for(const d in o.workouts){if(d>=today&&isPristine(o.workouts[d]))delete o.workouts[d];}
    o.planRev=10;
  }
  return o;
}
// "pristine" = auto-generated and never logged into (prefilled weights don't count as logged)
function isPristine(w){
  if(!w||w.completed||w.notes||w.rpe)return false;
  if(w.cardio&&w.cardio.actualMin)return false;
  return (w.exercises||[]).every(e=>(e.sets||[]).every(s=>!s.reps));
}

const el=(t,a,h)=>{const e=document.createElement(t);if(a)for(const k in a){if(k==="class")e.className=a[k];else if(k==="html")e.innerHTML=a[k];else e.setAttribute(k,a[k]);}if(h!=null)e.textContent=h;return e;};

function num(v,d=0){const n=parseFloat(v);return isFinite(n)?n:d;}

/* ---------- the Workout tab follows the rotation ----------
   The Workout tab logs by date (S.workouts). Its planned day is built from the
   same rotation as the session screen, so both always show the same exercises and
   weights. Days already logged are stored in full and never rebuilt. */
function tplFor(date){
  const day=wmDay(wmDayIdFor(date),date);
  if(day.type==="lift"){
    const b=wmBlockAt(date),cue=b?WM_WEEK_CUES[b.week-1]:null;
    const dayId=wmDayIdFor(date);
    const optCardio=dayId==="upperB"?{type:"Optional — Zone 2 rower",min:20,ref:"z2row",
        detail:"Optional on a bulk, after the lifting. Easy conversation pace, HR 125–132. Skip it if recovery or appetite is the limit."}
      :dayId==="pushB"?{type:"Optional — incline Zone 2 walk",min:20,ref:"z2walk",
        detail:"Optional on a bulk, after the lifting. 5.5 km/h at 7–9%, HR 125–132, hands off the rails."}:null;
    return {type:day.label,cardio:optCardio,
      note:b?`${b.block.name} block · week ${b.week} of ${b.weeks} (${cue.name}). ${cue.effort}`:"",
      exercises:day.exercises.map(pe=>{
        const ex=wmEx(pe.exerciseId),range=wmRange(pe,ex);
        return {name:ex.name,mg:ex.mg,sets:wmSets(pe,date),reps:range[0]+"-"+range[1]+(ex.unit==="s"?"s":""),
          wt:wmPrescription(ex.id,range,{deload:!!day.deload}).kg,perHand:!!ex.perHand,added:!!ex.bwBased,
          prog:ex.noE1RM&&ex.unit!=="s"?"":`top of the range on every set → +${ex.incrementKg}kg`};
      })};
  }
  const c=day.cardio;
  if(day.id==="rowInt")return {type:day.label,exercises:[],
    note:"Intervals are logged from the Today card (Start session).",
    cardio:{type:"Rower intervals",min:c.durationMin,ref:"rowint",detail:c.protocol+" · pace target "+wmRowerTargetLabel()+"."}};
  if(day.id==="z2Tread")return {type:day.label,exercises:[],
    note:"Easy conversation pace. Log it from the Today card (Start session).",
    cardio:{type:"Zone 2 — Incline walk",min:c.durationMin,ref:"z2walk",
      detail:`HR ${c.hrBand[0]}–${c.hrBand[1]} · incline ${c.inclinePct[0]}–${c.inclinePct[1]}% · ${c.speedKmh[0]}–${c.speedKmh[1]} km/h · hands off the rails.`}};
  return {type:"Rest",exercises:[],
    note:"Full rest day. The walk is optional and should feel like nothing — if it feels like training, you've missed the point.",
    cardio:{type:"Optional easy walk",min:30,ref:null,detail:"Optional. Flat or 2–3% · HR under 118 · podcast pace. Recovery, not a session."}};
}

/* ---------- per-day accessors ---------- */
function getWorkout(date){
  if(!S.workouts[date]){
    const t=tplFor(date);
    if(!S.liftWeights)S.liftWeights={};
    S.workouts[date]={type:t.type,planned:true,completed:false,
      exercises:t.exercises.map(e=>{
        const saved=S.liftWeights[e.name];
        const wt=(saved!=null&&saved!=="")?+saved:(e.wt!=null?e.wt:"");
        const fill=(wt!==""&&+wt>0)?String(wt):""; // bodyweight (0) stays blank
        return {name:e.name,mg:e.mg,target:`${e.sets}x${e.reps}`,wt:wt,perHand:!!e.perHand,added:!!e.added,prog:e.prog||"",
          sets:Array.from({length:e.sets},()=>({reps:"",weight:fill}))};
      }),
      cardio:t.cardio?{type:t.cardio.type,min:t.cardio.min,actualMin:""}:null,
      rpe:"",notes:""};
  }
  return S.workouts[date];
}
function getNutrition(date){
  if(!S.nutrition[date])S.nutrition[date]={meals:[],water:0,firstMeal:"",lastMeal:""};
  return S.nutrition[date];
}
function getSupps(date){
  if(!S.supplements[date])S.supplements[date]={taken:{}};
  return S.supplements[date];
}
function nutTotals(date){
  const n=getNutrition(date);let k=0,p=0,c=0,f=0;
  n.meals.forEach(m=>{k+=num(m.kcal);p+=num(m.protein);c+=num(m.netCarbs);f+=num(m.fat);});
  return {kcal:k,protein:p,netCarbs:c,fat:f,water:n.water||0};
}
function workoutVolume(w){
  let v=0;const byMg={};
  if(!w)return{total:0,byMg};
  w.exercises.forEach(e=>{e.sets.forEach(s=>{const r=num(s.reps),wt=num(s.weight);if(r&&wt){v+=r*wt;byMg[e.mg]=(byMg[e.mg]||0)+r*wt;}});});
  return {total:v,byMg};
}

// reps range out of a target like "3x6-10" or "3x30-45s" (a bare "3x10" is a single number)
function legacyRange(ex){
  const m=/x\s*(\d+)(?:-(\d+))?\s*(s?)/i.exec(ex.target||"");
  const lo=m?+m[1]:10,timed=!!(m&&m[3]);
  return {lo:lo,hi:m&&m[2]?+m[2]:lo,timed:timed,step:timed?5:1};
}
function exerciseCard(ex,ei,w){
  const c=el("div",{class:"ex"});
  const h=el("div",{class:"exh"});
  h.append(el("div",{class:"nm"},ex.name),el("span",{class:"tag"},ex.mg),el("span",{class:"tag"},"target "+ex.target));
  const wlabel=(ex.wt===0)?"BW":((ex.wt!==""&&ex.wt!=null)?(ex.added?"+":"")+ex.wt+"kg"+(ex.perHand?"/hand":""):null);
  if(wlabel)h.append(el("span",{class:"tag",style:"color:var(--acc);border-color:var(--line2)"},wlabel));
  const del=el("button",{class:"x"},"×");del.style.marginLeft="auto";
  del.onclick=()=>{w.exercises.splice(ei,1);save();render();};
  h.appendChild(del);c.appendChild(h);
  // persistent working weight ("my weight" for this lift) — skips bodyweight moves
  if(ex.wt!==0){
    const ww=el("div",{class:"spread small",style:"margin:0 0 8px"});
    ww.append(el("div",{class:"muted"},"Working weight"+(ex.perHand?" /hand":ex.added?" (added)":"")));
    const wi=el("input",{type:"number",inputmode:"decimal",placeholder:"kg",style:"max-width:120px;padding:7px 9px"});
    wi.value=(ex.wt!==""&&ex.wt!=null)?ex.wt:"";
    wi.onchange=()=>{const v=wi.value;ex.wt=v===""?"":+v;if(!S.liftWeights)S.liftWeights={};S.liftWeights[ex.name]=v;
      ex.sets.forEach(s=>{if(!s.reps&&(s.weight===""||s.weight==null))s.weight=v;});save();render();};
    ww.appendChild(wi);c.appendChild(ww);
  }
  if(ex.prog)c.appendChild(el("div",{class:"small",style:"color:var(--mut2);margin:0 0 8px"},"↑ move up: "+ex.prog));
  // quick fill: tap the reps you got and the next empty set fills in; one button fills the rest
  const empty=ex.sets.filter(s=>!s.reps).length;
  if(empty){
    const rg=legacyRange(ex),fillW=s=>{if((s.weight===""||s.weight==null)&&ex.wt>0)s.weight=String(ex.wt);};
    const filled=ex.sets.filter(s=>s.reps),R=filled.length?+filled[filled.length-1].reps:rg.lo;
    c.appendChild(el("div",{class:"small muted"},"Tap the reps you got for the next set:"));
    const chips=el("div",{class:"chips"});
    for(let r=Math.max(rg.step,rg.lo-rg.step);r<=rg.hi+rg.step;r+=rg.step){
      const ch=el("button",{class:"chip"+(r>=rg.lo&&r<=rg.hi?" hit":"")+(r===R?" sug":"")},String(r));
      ch.onclick=()=>{const si=ex.sets.findIndex(s=>!s.reps);if(si<0)return;ex.sets[si].reps=String(r);fillW(ex.sets[si]);save();buzz();render(true);};
      chips.appendChild(ch);
    }
    c.appendChild(chips);
    if(empty>=2){
      const all=el("button",{class:"btn sm sec full",style:"margin-bottom:10px"},`✓ Fill the other ${empty} sets × ${R}${rg.timed?" s":""}`);
      all.onclick=()=>{ex.sets.forEach(s=>{if(!s.reps){s.reps=String(R);fillW(s);}});save();buzz();render(true);};
      c.appendChild(all);
    }
  }
  const hd=el("div",{class:"setrow small muted"});
  hd.append(el("div",{class:"si"},"#"),el("div",null,"Reps"),el("div",null,"Weight kg"),el("div",null,""));
  c.appendChild(hd);
  ex.sets.forEach((st,si)=>{
    const r=el("div",{class:"setrow"});
    r.appendChild(el("div",{class:"si"},String(si+1)));
    const ri=el("input",{type:"number",inputmode:"numeric",placeholder:"reps"});ri.value=st.reps;
    ri.oninput=()=>{st.reps=ri.value;save();};
    const wi=el("input",{type:"number",inputmode:"decimal",placeholder:"kg"});wi.value=st.weight;
    wi.oninput=()=>{st.weight=wi.value;save();};
    const xb=el("button",{class:"x"},"×");xb.onclick=()=>{ex.sets.splice(si,1);save();render();};
    r.append(ri,wi,xb);c.appendChild(r);
  });
  const as=el("button",{class:"btn sm ghost"},"+ set");
  as.onclick=()=>{const last=ex.sets[ex.sets.length-1]||{reps:"",weight:""};ex.sets.push({reps:"",weight:last.weight});save();render();};
  c.appendChild(as);
  return c;
}

/* ---------- shared cardio session detail ----------
   The full prescription for one session — machine setup, minute-by-minute
   timeline, target numbers, governing rule, progression, technique. Rendered
   inline everywhere a session is named (Workout tab, cut weeks, cut days,
   block plan) so the instructions travel with the mention instead of living
   on a separate tab. */
function cardioSessionBody(s,headline){
  const box=el("div");
  if(headline){
    const hf=el("div",{class:"flag ok"});
    hf.append(el("div",{class:"dot"}),el("div",{html:"<b>Your dose:</b> "+headline}));
    box.appendChild(hf);
  }
  box.appendChild(el("div",{class:"sublab"},"Set the machine up"));
  const su=el("ul",{class:"tight"});
  s.setup.forEach(t=>su.appendChild(el("li",null,t)));
  box.appendChild(su);
  box.appendChild(el("div",{class:"sublab"},"The session, start to finish"));
  s.steps.forEach(st=>{
    const r=el("div",{class:"step"});
    r.appendChild(el("div",{class:"st"},st.t));
    const d=el("div");
    d.appendChild(el("div",{class:"sd"},st.d));
    if(st.g)d.appendChild(el("div",{class:"sg"},"→ "+st.g));
    r.appendChild(d);
    box.appendChild(r);
  });
  box.appendChild(el("div",{class:"sublab"},"The numbers"));
  const sp=el("div",{class:"spec"});
  s.specs.forEach(([k,v])=>{
    const b=el("div",{class:"sp"});
    b.append(el("div",{class:"k"},k),el("div",{class:"v"},v));
    sp.appendChild(b);

// which week of the cut today falls in, anchored to the active phase start (or null)
function cutWeekIndex(date){
  const ph=activePhase(date);
  if(!ph)return -1;
  const wk=Math.floor(daysBetween(ph.start,date)/7);
  return (wk>=0&&wk<CUT_PLAN.weeks.length)?wk:-1;
}

function wmClockStr(sec){sec=Math.max(0,Math.floor(sec));return Math.floor(sec/60)+":"+pad(sec%60);}
function wmEnsureTick(){
  if(wmTimer)return;
  wmTimer=setInterval(()=>{
    const sess=S.wm.activeSessionId&&S.wm.sessions[S.wm.activeSessionId];
    if(route!=="wmsession"||!sess){clearInterval(wmTimer);wmTimer=null;return;}
    if(sess.endedAt)return;
    const day=wmSessionDay(sess);
    const e=wmElapsedSec(sess);
    const clk=$("#wmClock");if(clk)clk.textContent=wmClockStr(e);
    const cap=$("#wmCap");
    if(cap&&day.type==="lift")cap.textContent=wmClockStr(WM_CAP_SEC-e)+" left of 45:00";
    const rc=$("#wmRestChip");
    if(rc){const left=Math.ceil((wmRestUntil-Date.now())/1000);
      if(left>0){rc.style.display="";rc.textContent="Rest "+wmClockStr(left)+" · tap to skip";}
      else rc.style.display="none";}
    if(day.type==="lift"&&e>=WM_CAP_SEC){
      wmFlagRemaining(sess);toast("45-min cap — remaining sets skipped");render();

}

        :`${wmSets(pe,sess.date)} × ${wmRange(pe,ex)[0]}–${wmRange(pe,ex)[1]} @ ${wmKgLabel(ex,wmWeightFor(sess,pe))}`;}).join("  |  ")));
    line.append(info,el("div",{class:"pill"+(logged>=total?" ok":"")},`${logged}/${total}`));

  if(g.key)c.appendChild(el("div",{class:"small",style:"color:var(--acc2);margin-bottom:6px"},"Superset — alternate the two, rest after each pair"));

// log one set from a tap, start the rest timer, and move on when the exercise (pair) is finished
function wmTapLog(sess,g,pe,setIndex,reps){
  wmLogSet(sess,pe,setIndex,wmWeightFor(sess,pe),reps!=null?reps:wmSuggestReps(sess,pe,setIndex));
  wmRestUntil=Date.now()+pe.restSeconds*1000;
  if(wmGroupDone(sess,g))wmUI.open=null;
  buzz();render(true);
}
function wmExBlock(sess,g,pe){
  const ex=wmEx(pe.exerciseId),range=wmRange(pe,ex),unit=ex.unit==="s"?" s":"",n=wmSets(pe,sess.date);
  const b=el("div",{style:"margin-bottom:12px"});
  const top=el("div",{class:"top",style:"display:flex;gap:7px;align-items:baseline;flex-wrap:wrap"});
  top.appendChild(el("div",{style:"font-weight:800;font-size:16px"},ex.name));
  top.appendChild(el("span",{class:"tag"},wmRangeLabel(ex,range)));
  if(ex.posture)top.appendChild(el("span",{class:"tag",style:"color:var(--acc2)"},"posture"));
  b.appendChild(top);
  // what you did last time, and where today's weight comes from
  const hist=wmSessionsFor(ex.id),last=hist.length?hist[hist.length-1]:null;
  const pres=wmPrescription(ex.id,range,{deload:!!sess.deload});
  let sub=last?`Last time: ${wmKgLabel(ex,last.logs[last.logs.length-1].weightKg)} × ${last.logs.map(l=>l.reps).join(" · ")}${unit}`:"First time on this lift";
  if(pres.why!=="hold"&&pres.why!=="calibration")sub+=" · "+wmWhyLabel(pres.why,pres.from);
  else if(!last)sub+=" · weight from your InBody";
  b.appendChild(el("div",{class:"small muted",style:"margin:2px 0 8px"},sub));

  // weight: type it or step it — it applies to every set of this exercise
  const wrow=el("div",{class:"wsctl",style:"margin:0 0 8px"});
  const wi=el("input",{type:"number",inputmode:"decimal",class:"wsw"});
  wi.value=String(wmWeightFor(sess,pe));
  const setW=v=>{v=Math.max(0,round(v,2));wmDrafts["w:"+ex.id]=v;wi.value=String(v);};
  wi.oninput=()=>{if(wi.value!==""&&isFinite(+wi.value))wmDrafts["w:"+ex.id]=+wi.value;};
  wrow.append(el("div",{class:"small muted",style:"min-width:54px"},"Weight"),
    wmStep("−",()=>setW(num(wi.value)-ex.incrementKg)),wi,
    wmStep("+",()=>setW(num(wi.value)+ex.incrementKg)),
    el("div",{class:"small muted"},ex.equipment==="bodyweight"?"kg added":ex.perHand?"kg / hand":"kg"));
  b.appendChild(wrow);

  // the sets: tap to log (at the suggested reps), tap a logged one to undo
  const next=wmNextSet(sess,pe);
  const sets=el("div",{class:"sets"});
  for(let i=0;i<n;i++){
    const lg=wmLoggedSet(sess.id,ex.id,i);
    const sb=el("button",{class:"setb"+(lg?(lg.skipped?" skip":" done"):(i===next?" next":""))},
      lg?(lg.skipped?"–":lg.reps+(unit?"s":"")):String(i+1));
    sb.onclick=()=>{
      if(lg&&!lg.skipped){wmUndoSet(sess,ex.id,i);render(true);}
      else if(!lg)wmTapLog(sess,g,pe,i,null);
    };
    sets.appendChild(sb);
  }
  b.appendChild(sets);
  if(next>=0){
    const R=wmSuggestReps(sess,pe,next);
    b.appendChild(el("div",{class:"small muted"},`Tap set ${next+1} to log ${R}${unit}, or tap the reps you got:`));
    const chips=el("div",{class:"chips"});
    wmRepChips(ex,range).forEach(r=>{
      const ch=el("button",{class:"chip"+(r>=range[0]&&r<=range[1]?" hit":"")+(r===R?" sug":"")},String(r));
      ch.onclick=()=>wmTapLog(sess,g,pe,next,r);
      chips.appendChild(ch);
    });
    b.appendChild(chips);
    const rem=[...Array(n).keys()].filter(i=>!wmLoggedSet(sess.id,ex.id,i)).length;
    if(rem>=2){
      const all=el("button",{class:"btn sm sec full"},`✓ All ${rem} remaining sets × ${R}${unit}`);
      all.onclick=()=>{wmLogRemaining(sess,[pe],R);wmRestUntil=Date.now()+pe.restSeconds*1000;
        if(wmGroupDone(sess,g))wmUI.open=null;buzz();render(true);};
      b.appendChild(all);
    }
  }
  return b;
}

function wmFinishRower(sess,day){
  const c=day.cardio;const times=[];
  for(let i=0;i<c.intervals.count;i++){
    const t=wmParseTime(wmDrafts["int"+i]);
    if(t!=null)times.push(t);
  }
  if(!times.length){toast("Enter at least one interval");return;}
  const sum=times.reduce((a,b)=>a+b,0);
  S.wm.cardioLogs.push({sessionId:sess.id,machine:"rower",
    splits:times.map(t=>({distanceM:500,timeSec:t})),
    avgPacePer500m:wmPaceStr(sum/times.length),
    durationMin:round((sum+90*(times.length-1))/60),
    timestamp:new Date().toISOString()});
  const next=wmNextRowerTarget(times,wmRowerTargetSec(),c.intervals.count);
  if(next!=null)S.wm.rowerPaceSec=next;
  sess.endedAt=new Date().toISOString();
  Object.keys(wmDrafts).forEach(k=>{if(k.indexOf("int")===0)delete wmDrafts[k];});
  save();render();
}

const WM_SHORT={upperA:"Push",upperB:"Pull",pushB:"Shoulders + arms",lowerA:"Legs 1 (squat)",lowerB:"Legs 2 (deadlift)",legsC:"Legs 3 (glutes, single-leg)",restDay:"Rest"};
const WM_DOW3=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

// working sets a week in a block's full six-day layout: lower body, upper body, core
function wmRegionSets(blockId){
  const r={legs:0,upper:0,core:0,legDays:0};
  ["upperA","upperB","pushB","lowerA","lowerB","legsC"].forEach(id=>{
    let legs=0;
    WM_BLOCKS[blockId].days[id].ex.forEach(pe=>{
      const mg=wmEx(pe.exerciseId).mg;
      if(/Quads|Hamstrings|Glutes|Calves|Posterior/.test(mg)){r.legs+=pe.sets;legs+=pe.sets;}
      else if(mg==="Core")r.core+=pe.sets;else r.upper+=pe.sets;

    if(legs>=9)r.legDays++;
  });
  return r;
}
function wmPostureSets(blockId){ // loaded posture sets across a block's lift days

  for(const id in WM_BLOCKS[blockId].days)
    WM_BLOCKS[blockId].days[id].ex.forEach(pe=>{if(wmEx(pe.exerciseId).posture)n+=pe.sets;});

  for(let i=0;i<7;i++){
    const date=addDays(mon,i),day=wmDay(wmDayIdFor(date),date);

      el("div",{class:"tp"},day.type==="lift"?"LIFT":day.type==="rest"?"REST":"CARDIO"));
    pd.appendChild(h);
    pd.appendChild(el("div",null,day.label));
    if(day.type==="lift"){
      pd.appendChild(el("div",{class:"small",style:"color:var(--acc2)"},
        `${wmSetQueue(day,date).length} sets · "SS" pairs alternate set for set · about ${wmEstimateMin(day,date)} min`));
      expander(pd,"exercises, sets × reps, weights",()=>wmPrescriptionList(day),true);
    } else if(day.cardio){
      pd.appendChild(el("div",{class:"small muted"},day.cardio.protocol+" · "+day.cardio.durationMin+" min"));
      if(day.cardio.machine==="rower")
        pd.appendChild(el("div",{class:"small",style:"color:var(--acc2)"},"Pace target: "+wmRowerTargetLabel()));
      if(day.cardio.hrBand)
        pd.appendChild(el("div",{class:"small muted"},`HR ${day.cardio.hrBand[0]}–${day.cardio.hrBand[1]}`+
          (day.cardio.inclinePct?` · incline ${day.cardio.inclinePct[0]}–${day.cardio.inclinePct[1]}%`:"")+
          (day.cardio.speedKmh?` · ${day.cardio.speedKmh[0]}–${day.cardio.speedKmh[1]} km/h`:"")));
    }
    if(i===3&&wmPhase2(date))pd.appendChild(el("div",{class:"small",style:"color:var(--acc2)"},"or Treadmill HIIT — 10 × 30 s hard / 90 s easy"));
    card.appendChild(pd);
  }
  root.appendChild(card);
}
// rough session length for planning: 35 s a set, rests as prescribed, 15 s swap inside a superset, 30 s set-up per exercise
function wmEstimateMin(day,date){
  const groups=[];
  day.exercises.forEach(pe=>{const g=groups[groups.length-1];
    if(pe.supersetGroup&&g&&g.key===pe.supersetGroup)g.list.push(pe);else groups.push({key:pe.supersetGroup||null,list:[pe]});});
  let sec=0;
  groups.forEach(g=>{
    const rounds=Math.max(...g.list.map(pe=>wmSets(pe,date)));
    sec+=g.list.length===1?rounds*(35+g.list[0].restSeconds)
      :rounds*(35*g.list.length+15*(g.list.length-1)+g.list[g.list.length-1].restSeconds);
    sec+=30*g.list.length;
  });
  return Math.round(sec/60);
}
function wmPrescriptionList(day){
  const box=el("div");
  day.exercises.forEach(pe=>{
    const ex=wmEx(pe.exerciseId),range=wmRange(pe,ex);const p=wmPrescription(ex.id,range,{deload:!!day.deload});
    const r=el("div",{class:"meal"});
    const swap=pe.supersetGroup&&pe.restSeconds<=30; // compound paired with a posture lift: straight across, rest after the pair
    const note=(p.why==="calibration"||p.why==="hold")?"":" · "+wmWhyLabel(p.why,p.from); // the InBody basis is stated once, not on every row
    const info=el("div");info.append(el("div",{class:"mn"},ex.name),
      el("div",{class:"mm"},`${pe.sets} × ${wmRangeLabel(ex,range)} · ${swap?"straight to the next lift":"rest "+pe.restSeconds+"s"}${pe.supersetGroup?" · SS "+pe.supersetGroup:""}${ex.posture?" · posture":""}${note}`));
    r.append(info,el("div",{class:"mk"},wmKgLabel(ex,p.kg)));
    box.appendChild(r);
  });
  return box;
}
