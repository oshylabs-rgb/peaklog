/* ============================================================
   WEEKLY SNAPSHOT — am I growing, holding or slipping?
   Reads BOTH logging systems (session screen + Workout tab) and judges the
   week on strength first, consistency second:
   · strength = each lift's best estimated 1RM (Epley) this week against the
     median of its last three non-deload weeks. It is rep-range independent, so
     a Build → Strength block change doesn't fake a gain or a loss.
   · consistency = sessions done against sessions due so far.
   Deload weeks are planned, so they are never read as going backward.
   Body weight / body fat are shown for context, not scored.
   ============================================================ */
const SNAP_UP=0.01, SNAP_DOWN=-0.02;   // vs the median of the last three non-deload weeks
function snapKey(name){return String(name).toLowerCase().replace(/[^a-z0-9]/g,"").replace(/s$/,"");}
function snapMedian(a){const s=a.slice().sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function snapIsDeload(mon){const b=wmBlockAt(mon);return !!(b&&b.deload);}
// every performed set from both logging systems, in one shape
function snapSets(){
  const out=[];
  S.wm.setLogs.forEach(l=>{
    if(l.skipped)return;
    const sess=S.wm.sessions[l.sessionId],ex=wmEx(l.exerciseId);
    if(!sess||!ex)return;
    const kg=num(l.weightKg),reps=num(l.reps);
    if(!(reps>0))return;
    const eff=wmEffKg(ex,kg);
    out.push({date:sess.date,week:mondayOf(sess.date),key:snapKey(ex.name),name:ex.name,mg:ex.mg,kind:"lift",
      vol:ex.unit==="s"?0:kg*reps,e1rm:(!ex.noE1RM&&eff>0&&reps<=30)?wmE1RM(eff,reps):null});
  });
  for(const d in S.workouts){
    (S.workouts[d].exercises||[]).forEach(e=>{
      (e.sets||[]).forEach(st=>{
        const reps=num(st.reps),kg=num(st.weight);
        if(!(reps>0))return;
        const eff=e.added?wmBodyKg()+kg:kg;
        out.push({date:d,week:mondayOf(d),key:snapKey(e.name),name:e.name,mg:e.mg||"Other",kind:"lift",
          vol:kg*reps,e1rm:(kg>0&&reps<=20&&eff>0)?wmE1RM(eff,reps):null});
      });
    });
  }
  return out;
}
// which dates in [mon, mon+6] hold lift or cardio evidence, and how many cardio minutes
function snapDays(mon){
  const lift={},cardio={};let cardioMin=0;
  for(let i=0;i<7;i++){
    const d=addDays(mon,i),w=S.workouts[d];
    if(w){
      if((w.exercises||[]).some(e=>(e.sets||[]).some(s=>num(s.reps)>0)))lift[d]=1;
      if(w.cardio&&num(w.cardio.actualMin)>0){cardio[d]=1;cardioMin+=num(w.cardio.actualMin);}
    }
  }
  for(const id in S.wm.sessions){
    const sess=S.wm.sessions[id];
    if(sess.date<mon||sess.date>addDays(mon,6))continue;
    const day=WM_DAYS[sess.programmeDayId];if(!day)continue;
    if(day.type==="lift"){
      if(S.wm.setLogs.some(l=>l.sessionId===id&&!l.skipped&&num(l.reps)>0))lift[sess.date]=1;
    } else if(sess.endedAt&&day.type!=="rest"){
      cardio[sess.date]=1;
      S.wm.cardioLogs.forEach(c=>{if(c.sessionId===id)cardioMin+=num(c.durationMin);});
    }
  }
  return {lift,cardio,cardioMin};
}
// the first date anything was ever logged — sessions planned before that were never "due"
function snapFirstDate(sets){
  let f=null;const upd=d=>{if(d&&(!f||d<f))f=d;};
  sets.forEach(s=>upd(s.date));
  S.wm.cardioLogs.forEach(c=>{const s=S.wm.sessions[c.sessionId];if(s)upd(s.date);});
  for(const d in S.workouts){const w=S.workouts[d];if(w&&w.cardio&&num(w.cardio.actualMin)>0)upd(d);}
  return f;
}
function weekSnapshot(mon,noTrail){
  const today=todayISO(),sun=addDays(mon,6);
  const sets=snapSets(),firstDate=snapFirstDate(sets);
  const byWeek={};
  sets.forEach(s=>{
    const w=byWeek[s.week]||(byWeek[s.week]={vol:0,keys:{}});
    w.vol+=s.vol;
    if(s.e1rm!=null){const k=w.keys[s.key]||(w.keys[s.key]={name:s.name,best:0});k.best=Math.max(k.best,s.e1rm);}
  });
  const blk=wmBlockAt(mon),deload=snapIsDeload(mon);
  const cur=byWeek[mon]||{vol:0,keys:{}};

  // ---- strength: this week against recent history ----
  const lifts=[];
  Object.keys(cur.keys).forEach(k=>{
    const now=cur.keys[k].best,prior=[];
    for(let i=1;i<=8&&prior.length<3;i++){
      const wk=addDays(mon,-7*i),w=byWeek[wk];
      if(w&&w.keys[k]&&!snapIsDeload(wk))prior.push(w.keys[k].best);
    }
    if(!prior.length){lifts.push({key:k,name:cur.keys[k].name,now:now,base:null,pct:null,state:"new",pr:false});return;}
    const base=snapMedian(prior),pct=now/base-1;
    let allBefore=0;
    for(const wk in byWeek){if(wk<mon&&byWeek[wk].keys[k]&&!snapIsDeload(wk))allBefore=Math.max(allBefore,byWeek[wk].keys[k].best);}
    lifts.push({key:k,name:cur.keys[k].name,now:now,base:base,pct:pct,
      state:pct>=SNAP_UP?"up":pct<=SNAP_DOWN?"down":"flat",pr:now>=allBefore*1.005});
  });
  const cmp=lifts.filter(l=>l.state!=="new");
  const up=cmp.filter(l=>l.state==="up").length,down=cmp.filter(l=>l.state==="down").length,flat=cmp.length-up-down;
  const prs=cmp.filter(l=>l.pr);

  // ---- consistency: sessions done against sessions due so far ----
  const dd=snapDays(mon);
  let liftPlanned=0,cardioPlanned=0,liftDue=0,cardioDue=0;
  for(let i=0;i<7;i++){
    const d=addDays(mon,i),t=WM_DAYS[wmDayIdFor(d)].type;
    const kind=t==="lift"?"lift":t==="rest"?null:"cardio";
    if(!kind)continue;
    if(kind==="lift")liftPlanned++;else cardioPlanned++;
    const done=kind==="lift"?dd.lift[d]:dd.cardio[d];
    if(firstDate==null||d<firstDate)continue; // before logging began: never due
    if(d<today||(d===today&&done)){if(kind==="lift")liftDue++;else cardioDue++;}
  }
  const liftDone=Object.keys(dd.lift).length,cardioDone=Object.keys(dd.cardio).length;
  const due=liftDue+cardioDue,done=Math.min(liftDone,liftPlanned)+Math.min(cardioDone,cardioPlanned);
  const C=due?Math.min(1,done/due):(done?1:null);

  // ---- volume against the last non-deload week with data ----
  let prevVol=null;
  for(let i=1;i<=8&&prevVol==null;i++){const wk=addDays(mon,-7*i);if(byWeek[wk]&&byWeek[wk].vol>0&&!snapIsDeload(wk))prevVol=byWeek[wk].vol;}
  const volPct=(prevVol&&cur.vol>0)?cur.vol/prevVol-1:null;
  const volByMg={};
  sets.forEach(s=>{if(s.week===mon&&s.vol>0)volByMg[s.mg]=(volByMg[s.mg]||0)+s.vol;});

  // ---- body (context only) ----
  const bw=S.bodyLog.filter(b=>b.weight);
  const inWk=bw.filter(b=>b.date>=mon&&b.date<=sun),before=bw.filter(b=>b.date<mon);
  const bodyNow=inWk.length?inWk[inWk.length-1]:null,bodyPrev=before.length?before[before.length-1]:null;
  const body=bodyNow?{weight:bodyNow.weight,dWeight:bodyPrev?round(bodyNow.weight-bodyPrev.weight,1):null,
    bf:bodyNow.bodyFat||null,dBf:(bodyNow.bodyFat&&bodyPrev&&bodyPrev.bodyFat)?round(bodyNow.bodyFat-bodyPrev.bodyFat,1):null}:null;

  // ---- verdict ----
  let verdict,headline;
  const hasAny=cur.vol>0||done>0;
  if(!hasAny&&!due){verdict="none";headline=mon>today?"This week hasn't started.":"Nothing due yet — log a session and the snapshot starts.";}
  else if(deload){verdict="deload";headline="Deload week — lighter on purpose. Recovery is the work, so this isn't counted as going backward.";}
  else if(due>=3&&C!=null&&C<0.5){verdict="slipping";headline=`Only ${done} of ${due} sessions done — consistency is what's slipping, not your strength.`;}
  else if(cmp.length>=3&&down/cmp.length>=0.4&&up/cmp.length<0.25){verdict="slipping";headline=`${down} of ${cmp.length} lifts are down on recent weeks. Check sleep, food and stress before pushing harder.`;}
  else if(!cmp.length){verdict=(C!=null&&C>=0.75)?"baseline":"holding";
    headline=verdict==="baseline"?"Baseline week — your lifts are on record. From next week the snapshot compares against them.":"Not enough lifts logged yet to compare. Get the sessions in.";}
  else if(C!=null&&C>=0.75&&((up>=2&&up>down)||(up>=1&&down===0&&up/cmp.length>=0.3))){verdict="growing";
    headline=`${up} of ${cmp.length} lifts are up${prs.length?`, ${prs.length} new best${prs.length>1?"s":""}`:""}. You're getting stronger.`;}
  else{verdict="holding";headline=`Steady — ${up} up, ${flat} flat, ${down} down. Add a rep on each set before adding weight.`;}

  // ---- what to do next week ----
  const nb=wmBlockAt(addDays(mon,7));
  let next;
  if(nb&&nb.deload)next="Deload next week: about 10% lighter and one set fewer. Let it consolidate.";
  else if(nb&&blk&&nb.index!==blk.index)next=`New block next week: ${nb.block.name}. Weights are re-set from your last sessions, so start where the screen says.`;
  else if(verdict==="slipping")next="Get every session in before chasing load. Hold the weights; don't add.";
  else if(verdict==="growing")next="Keep the double progression going: top of the range on every set, then take the smallest jump.";
  else next="Beat last week by one rep on the first lift of each session.";

  // ---- the last four weeks at a glance ----
  const trail=[];
  if(!noTrail)for(let i=4;i>=1;i--){const m=addDays(mon,-7*i);const s=weekSnapshot(m,true);trail.push({mon:m,verdict:s.verdict});}

  // ---- big lifts since logging began ----
  const bigLifts=[];
  ["Back Squat","Deadlift","Barbell Bench Press","Barbell Overhead Press","Barbell Row","Hip Thrust"].forEach(nm=>{
    const k=snapKey(nm),wks=Object.keys(byWeek).filter(w=>byWeek[w].keys[k]&&!snapIsDeload(w)&&w<=mon).sort();
    if(wks.length<2)return;
    const first=byWeek[wks[0]].keys[k].best,recent=Math.max(...wks.slice(-4).map(w=>byWeek[w].keys[k].best));
    bigLifts.push({name:nm,first:first,now:recent,pct:recent/first-1,since:wks[0]});
  });

  return {mon:mon,sun:sun,block:blk,verdict:verdict,headline:headline,next:next,trail:trail,
    lifts:lifts,up:up,down:down,flat:flat,prs:prs,volume:cur.vol,volPct:volPct,volByMg:volByMg,
    sessions:{done:done,due:due,pct:C},
    train:{liftPlanned,cardioPlanned,liftDone:Math.min(liftDone,liftPlanned),liftDue,cardioDone:Math.min(cardioDone,cardioPlanned),cardioDue,cardioMin:dd.cardioMin},
    body:body,bigLifts:bigLifts};
}
const SNAP_UI={
  growing:{sym:"▲",word:"Growing",col:"var(--good)",cls:"ok"},
  holding:{sym:"■",word:"Holding",col:"var(--acc2)",cls:"ok"},
  slipping:{sym:"▼",word:"Slipping",col:"var(--bad)",cls:"bad"},
  deload:{sym:"◆",word:"Deload",col:"var(--warn)",cls:"warn"},
  baseline:{sym:"●",word:"Baseline",col:"var(--mut)",cls:"ok"},
  none:{sym:"○",word:"No data",col:"var(--mut2)",cls:"ok"}
};
function snapshotCard(mon,compact){
  const sn=weekSnapshot(mon),ui=SNAP_UI[sn.verdict];
  const thisMon=mondayOf(todayISO());
  const c=el("div",{class:"card"});
  c.appendChild(el("h2",{html:`Weekly snapshot <span class="sub">${mon===thisMon?"this week so far":"week of "+fmtNice(mon)}${sn.block?` · ${sn.block.block.name} wk ${sn.block.week}`:""}</span>`}));
  const top=el("div",{class:"spread",style:"align-items:flex-start"});
  const l=el("div");
  l.appendChild(el("div",{style:"font-size:26px;font-weight:800;color:"+ui.col},`${ui.sym} ${ui.word}`));
  l.appendChild(el("div",{style:"margin-top:2px"},sn.headline));
  top.appendChild(l);c.appendChild(top);
  if(sn.verdict==="none")return c; // nothing to compare yet — keep the empty state quiet
  if(sn.trail.length){
    const tr=el("div",{class:"row",style:"margin:10px 0 2px;gap:6px;align-items:center"});
    tr.appendChild(el("span",{class:"small muted"},"Last 4 weeks"));
    sn.trail.forEach(t=>{const u=SNAP_UI[t.verdict];
      tr.appendChild(el("span",{class:"pill",title:u.word+" · week of "+fmtNice(t.mon),style:"padding:3px 9px;color:"+u.col},u.sym));});
    c.appendChild(tr);
  }
  const g=el("div",{class:"grid3",style:"margin-top:10px"});
  g.append(
    stat("Lifts",sn.up+sn.flat+sn.down?`<span style="font-size:16px;white-space:nowrap">▲${sn.up} ■${sn.flat} ▼${sn.down}</span>`:"--",""),
    stat("Sessions",sn.sessions.due||sn.sessions.done?`${sn.sessions.done}/${Math.max(sn.sessions.due,sn.sessions.done)}`:"--","done"),
    stat("Volume",sn.volPct==null?(sn.volume>0?round(sn.volume).toLocaleString():"--"):((sn.volPct>=0?"+":"")+round(sn.volPct*100)+"%"),sn.volPct==null?"kg":"vs last wk"));
  c.appendChild(g);
  const flags=[];
  if(sn.prs.length)flags.push(["ok",`New best: ${sn.prs.slice(0,3).map(p=>`${p.name} ~${round(p.now)} kg (+${round(p.pct*100,1)}%)`).join(", ")}.`]);
  const dn=sn.lifts.filter(x=>x.state==="down").sort((a,b)=>a.pct-b.pct).slice(0,2);
  if(dn.length&&sn.verdict!=="deload")flags.push(["warn",`Down on recent weeks: ${dn.map(x=>`${x.name} ${round(x.pct*100,1)}%`).join(", ")}.`]);
  if(sn.body){
    const bits=[`${sn.body.weight} kg`+(sn.body.dWeight!=null?` (${sn.body.dWeight>=0?"+":""}${sn.body.dWeight})`:"")];
    if(sn.body.bf)bits.push(`${sn.body.bf}% body fat`+(sn.body.dBf!=null?` (${sn.body.dBf>=0?"+":""}${sn.body.dBf})`:""));
    flags.push([sn.body.dWeight!=null&&Math.abs(sn.body.dWeight)>0.8?"warn":"ok","Body: "+bits.join(" · ")+"."]);
  }
  flags.push(["ok","Next week: "+sn.next]);
  flags.forEach(([cls,msg])=>{const f=el("div",{class:"flag "+cls,style:"margin-top:8px;margin-bottom:0"});f.append(el("div",{class:"dot"}),el("div",null,msg));c.appendChild(f);});
  if(compact){
    const b=el("button",{class:"btn sm sec",style:"margin-top:10px"},"Open the full review");
    b.onclick=()=>{weekCursor=mon;route="review";render();};
    c.appendChild(b);
    return c;
  }
  if(sn.lifts.length){
    expander(c,"lift by lift",()=>{
      const box=el("div");
      sn.lifts.slice().sort((a,b)=>(b.pct==null?-9:b.pct)-(a.pct==null?-9:a.pct)).forEach(x=>{
        const r=el("div",{class:"meal"});
        const info=el("div");info.append(el("div",{class:"mn"},x.name),
          el("div",{class:"mm"},x.base==null?"first time on record":`~${round(x.now)} kg e1RM vs ~${round(x.base)} kg recent`));
        const col=x.state==="up"?"var(--good)":x.state==="down"?"var(--bad)":"var(--mut)";
        r.append(info,el("div",{class:"mk",style:"color:"+col},x.pct==null?"new":((x.pct>=0?"+":"")+round(x.pct*100,1)+"%")));
        box.appendChild(r);
      });
      return box;
    },false);
  }
  if(sn.bigLifts.length){
    expander(c,"big lifts since you started",()=>{
      const box=el("div");
      sn.bigLifts.forEach(x=>{
        const r=el("div",{class:"meal"});
        const info=el("div");info.append(el("div",{class:"mn"},x.name),el("div",{class:"mm"},`~${round(x.first)} kg e1RM on ${fmtNice(x.since)} → ~${round(x.now)} kg best of the last 4 weeks`));
        r.append(info,el("div",{class:"mk",style:"color:"+(x.pct>=0?"var(--good)":"var(--bad)")},(x.pct>=0?"+":"")+round(x.pct*100,1)+"%"));
        box.appendChild(r);
      });
      return box;
    },false);
  }
  return c;
}

/* ============================================================
   WEEKLY REVIEW
   ============================================================ */
function viewReview(root){
  const mon=weekCursor;const sun=addDays(mon,6);
  const nav=el("div",{class:"daynav"});
  const prev=el("button",null,"‹");const next=el("button",null,"›");
  const lbl=el("div",{class:"d small"},`Week of ${fmtNice(mon)} → ${fmtNice(sun)}`);
  prev.onclick=()=>{weekCursor=addDays(weekCursor,-7);render();};
  next.onclick=()=>{weekCursor=addDays(weekCursor,7);render();};
  nav.append(prev,lbl,next);
  const tw=el("button",null,"●");tw.onclick=()=>{weekCursor=mondayOf(todayISO());render();};nav.append(tw);
  root.appendChild(nav);
  root.appendChild(snapshotCard(mon,false));

  const days=Array.from({length:7},(_,i)=>addDays(mon,i));
  // ---- training (session screen + Workout tab, one set of numbers) ----
  const snap=weekSnapshot(mon,true);
  const sessionsPlanned=snap.train.liftDue,sessionsDone=snap.train.liftDone,totalVol=snap.volume,volByMg=snap.volByMg,cardioMin=snap.train.cardioMin;
  // ---- nutrition ----
  let nDays=0,sumK=0,sumP=0,sumC=0,sumF=0,proteinMiss=0,carbBreach=0,fastOk=0,fastDays=0;
  const t=S.targets;
  days.forEach(d=>{
    const n=S.nutrition[d];if(!n||!n.meals.length)return;nDays++;
    const tt=nutTotals(d);sumK+=tt.kcal;sumP+=tt.protein;sumC+=tt.netCarbs;sumF+=tt.fat;
    if(tt.protein<t.protein*0.9)proteinMiss++;
    if(tt.netCarbs>t.netCarbCeiling)carbBreach++;
    if(n.firstMeal&&n.lastMeal){fastDays++;const fast=24-(toMin(n.lastMeal)-toMin(n.firstMeal))/60;if(fast>=t.fastHours-0.25)fastOk++;}
  });
  // ---- supplements ----
  let suppTaken=0;days.forEach(d=>{const s=S.supplements[d];if(s)suppTaken+=Object.values(s.taken).filter(Boolean).length;});
  const suppPct=Math.round(suppTaken/(SUPPS.length*7)*100);
  // ---- body ----
  const wk=S.bodyLog.filter(b=>b.date>=mon&&b.date<=sun);
  const proj=projection();

  // training card
  const c1=el("div",{class:"card"});
  c1.appendChild(el("h2",{html:`Training <span class="sub">${sessionsDone}/${sessionsPlanned} lift sessions</span>`}));
  const g=el("div",{class:"grid3"});
  g.append(stat("Volume",round(totalVol).toLocaleString(),"kg"),stat("Cardio",round(cardioMin),"min"),stat("Lifts",`${sessionsDone}/${sessionsPlanned}`,""));
  c1.appendChild(g);
  const mgKeys=Object.keys(volByMg).sort((a,b)=>volByMg[b]-volByMg[a]);
  if(mgKeys.length){
    const maxv=Math.max(...mgKeys.map(k=>volByMg[k]));
    c1.appendChild(el("div",{class:"small muted",style:"margin:10px 0 4px"},"Volume by muscle group (kg)"));
    mgKeys.forEach(k=>{
      const wr=el("div",{style:"margin-bottom:7px"});
      const top=el("div",{class:"spread small"});top.append(el("div",{class:"muted"},k),el("div",null,round(volByMg[k]).toLocaleString()));
      wr.appendChild(top);
      const bar=el("div",{class:"bar"});const i=el("i");i.style.width=(volByMg[k]/maxv*100)+"%";bar.appendChild(i);wr.appendChild(bar);
      c1.appendChild(wr);
    });
  }
  root.appendChild(c1);

  // nutrition card
  const c2=el("div",{class:"card"});
  c2.appendChild(el("h2",{html:`Nutrition <span class="sub">${nDays}/7 days logged</span>`}));
  if(nDays){
    const g2=el("div",{class:"grid2"});
    g2.append(
      stat("Avg kcal",round(sumK/nDays),"/ "+t.kcal),
      stat("Avg protein",round(sumP/nDays),"g / "+t.protein),
      stat("Avg net carb",round(sumC/nDays),"g"),
      stat("Avg fat",round(sumF/nDays),"g")
    );
    c2.appendChild(g2);
    if(fastDays)c2.appendChild(el("div",{class:"small muted",style:"margin-top:8px"},`Fasting window hit ${fastOk}/${fastDays} logged days`));
  }else c2.appendChild(el("div",{class:"empty"},"No nutrition logged this week."));
  root.appendChild(c2);

  // adherence card
  const c3=el("div",{class:"card"});
  c3.appendChild(el("h2",null,"Adherence"));
  c3.appendChild(macroBar("Supplements",suppPct,100,"%",false));
  c3.appendChild(macroBar("Training sessions",sessionsDone,sessionsPlanned||1,"",false));
  c3.appendChild(macroBar("Nutrition days logged",nDays,7,"",false));
  root.appendChild(c3);

  // body + projection
  const c4=el("div",{class:"card"});
  c4.appendChild(el("h2",null,"Body & physiology"));
  if(wk.length){
    const first=wk[0],last=wk[wk.length-1];
    const dw=round(last.weight-first.weight,1);
    const g4=el("div",{class:"grid3"});
    g4.append(stat("Weight",last.weight,"kg"),stat("Δ week",(dw>0?"+":"")+dw,"kg"),stat("Body fat",last.bodyFat||"--","%"));
    c4.appendChild(g4);
  } else c4.appendChild(el("div",{class:"small muted"},"No weigh-ins this week. Log weight on the Nutrition tab."));
  if(proj.ok){const f=el("div",{class:"flag "+proj.cls,style:"margin-top:10px"});f.append(el("div",{class:"dot"}),el("div",null,proj.msg));c4.appendChild(f);}
  root.appendChild(c4);

  // flags
  const flags=[];
  if(sessionsPlanned&&sessionsDone>=sessionsPlanned)flags.push(["ok",`All ${sessionsPlanned} lifting sessions completed. Strong week.`]);
  else if(sessionsPlanned)flags.push([sessionsDone>=sessionsPlanned-1?"warn":"bad",`${sessionsDone} of ${sessionsPlanned} lifting sessions done.`]);
  if(proteinMiss)flags.push(["warn",`Protein under target on ${proteinMiss} of ${nDays} logged day${proteinMiss===1?"":"s"}. Protein is the raw material — muscle won't grow without it.`]);
  if(carbBreach)flags.push(["warn",`Carb ceiling passed on ${carbBreach} day${carbBreach===1?"":"s"} — past ~${t.netCarbCeiling}g the surplus turns to fat.`]);
  if(nDays&&sumK/nDays<t.kcal*0.92)flags.push(["warn",`Averaging ${round(sumK/nDays)} kcal vs ${t.kcal} target — you can't build muscle under-fed. Eat the surplus.`]);
  else if(nDays)flags.push(["ok","Calories on target — the surplus is doing its job."]);
  if(suppPct>=90)flags.push(["ok",`Supplement adherence ${suppPct}%.`]);
  else if(suppPct<70&&suppTaken)flags.push(["warn",`Supplement adherence ${suppPct}% — creatine daily matters most this block; magnesium at 19:30 anchors sleep.`]);
  const cf=el("div",{class:"card"});
  cf.appendChild(el("h2",null,"Flags & coaching"));
  if(!flags.length)cf.appendChild(el("div",{class:"empty"},"Log a full week to generate flags."));
  flags.forEach(([cls,msg])=>{const f=el("div",{class:"flag "+cls});f.append(el("div",{class:"dot"}),el("div",null,msg));cf.appendChild(f);});
  root.appendChild(cf);
}

/* ---------- projection engine: linear regression on body weight ---------- */
function latestBody(){return S.bodyLog.length?S.bodyLog[S.bodyLog.length-1]:null;}
function projection(){
  const pts=S.bodyLog.filter(b=>b.weight).map(b=>({x:daysBetween(BASELINE.date,b.date),y:b.weight}));
  if(pts.length<2)return {ok:false};
  // least squares
  const n=pts.length;let sx=0,sy=0,sxy=0,sxx=0;
  pts.forEach(p=>{sx+=p.x;sy+=p.y;sxy+=p.x*p.y;sxx+=p.x*p.x;});
  const slope=(n*sxy-sx*sy)/(n*sxx-sx*sx);const intercept=(sy-slope*sx)/n;
  const ratePerWeek=slope*7;
  const goalDayIdx=daysBetween(BASELINE.date,S.profile.goalDate);
  const projWeightAtGoal=slope*goalDayIdx+intercept;
  const rateTxt=`${ratePerWeek>=0?"+":""}${round(ratePerWeek,2)} kg/wk`;
  const ph=activePhase(todayISO());
  const mode=ph?ph.mode:"gain";
  let msg,cls;
  if(mode==="cut"){
    // cut: losing 0.3-1.0 kg/wk is the win; flat/up means tighten
    if(ratePerWeek>-0.05){cls="bad";msg=`Weight trend ${rateTxt} — flat/up during ${ph.label}. Tighten the deficit: cut ~200 kcal or add a walk.`;}
    else if(ratePerWeek>-0.3){cls="warn";msg=`Losing ${round(-ratePerWeek,2)} kg/wk — slower than the 0.3-1.0 sprint band. A small extra deficit speeds it up.`;}
    else if(ratePerWeek>=-1.0){cls="ok";msg=`Losing ${round(-ratePerWeek,2)} kg/wk — inside the sprint band (0.3-1.0). Projected ${round(projWeightAtGoal,1)}kg by ${fmtNice(S.profile.goalDate)}.`;}
    else{cls="warn";msg=`Losing ${round(-ratePerWeek,2)} kg/wk — faster than 1.0; muscle is at risk. Add ~150 kcal (protein first).`;}
  } else if(mode==="hold"){
    // hold: stay within ±0.25 kg/wk
    if(Math.abs(ratePerWeek)<=0.25){cls="ok";msg=`Weight trend ${rateTxt} — holding steady, exactly the ${ph.label} brief.`;}
    else if(ratePerWeek>0.25){cls="warn";msg=`Gaining ${round(ratePerWeek,2)} kg/wk — more than a nudge. Pull ~150 kcal back.`;}
    else{cls="warn";msg=`Losing ${round(-ratePerWeek,2)} kg/wk — drifting into a cut. Add ~150 kcal to hold.`;}
  } else {
    // gain: lean-bulk band
    if(ratePerWeek<BULK_RATE.lo){cls="warn";msg=`Weight trend ${rateTxt} — too flat to grow. Add ~150 kcal of carbs and keep lifting; projected ${round(projWeightAtGoal,1)}kg by ${fmtNice(S.profile.goalDate)}.`;}
    else if(ratePerWeek<=BULK_RATE.hi){cls="ok";msg=`Gaining ${round(ratePerWeek,2)} kg/wk — inside the lean-gain band (${BULK_RATE.lo}-${BULK_RATE.hi}). Projected ${round(projWeightAtGoal,1)}kg by ${fmtNice(S.profile.goalDate)}; target ~${TARGET_WEIGHT}kg.`;}
    else{cls="warn";msg=`Gaining ${round(ratePerWeek,2)} kg/wk — faster than the lean band (max ${BULK_RATE.hi}); the excess is mostly fat. Pull ~150 kcal back.`;}
  }
  return {ok:true,cls,msg,slope,ratePerWeek,projWeightAtGoal};
}

/* ============================================================

function viewTrends(root){
  // weight
  const wpts=S.bodyLog.filter(b=>b.weight).map(b=>({d:b.date,v:b.weight}));
  const c1=el("div",{class:"card"});c1.appendChild(el("h2",null,"Body weight (kg)"));
  c1.appendChild(lineChart(wpts,{target:TARGET_WEIGHT,unit:"kg",color:"var(--acc)"}));
  c1.appendChild(el("div",{class:"legend",html:`<span><i style="background:var(--acc)"></i>Weight</span><span><i style="background:var(--acc2)"></i>Target ${TARGET_WEIGHT}kg</span>`}));
  root.appendChild(c1);

  // body fat
  const bpts=S.bodyLog.filter(b=>b.bodyFat).map(b=>({d:b.date,v:b.bodyFat}));
  const c2=el("div",{class:"card"});c2.appendChild(el("h2",null,"Body fat (%)"));
  if(bpts.length)c2.appendChild(lineChart(bpts,{target:GOAL.bf,unit:"%",color:"var(--warn)"}));
  else c2.appendChild(el("div",{class:"empty"},"Add body-fat readings to chart this."));
  root.appendChild(c2);

  // weekly volume (last 8 weeks)
  const c3=el("div",{class:"card"});c3.appendChild(el("h2",null,"Weekly training volume (kg)"));
  const vpts=[];let m=mondayOf(todayISO());
  for(let i=7;i>=0;i--){const wm=addDays(m,-7*i);let v=0;for(let d=0;d<7;d++){const w=S.workouts[addDays(wm,d)];if(w)v+=workoutVolume(w).total;}vpts.push({d:wm,v:round(v)});}
  c3.appendChild(barChart(vpts));
  root.appendChild(c3);

  // protein adherence (last 14 days)
  const c4=el("div",{class:"card"});c4.appendChild(el("h2",null,"Protein vs target (last 14 days)"));
  const ppts=[];for(let i=13;i>=0;i--){const d=addDays(todayISO(),-i);const tt=nutTotals(d);ppts.push({d:d,v:round(tt.protein)});}
  c4.appendChild(barChart(ppts,{target:S.targets.protein}));
  root.appendChild(c4);
}
function lineChart(pts,opt){
  opt=opt||{};const W=620,H=180,pad=28;
  if(pts.length<1)return el("div",{class:"empty"},"No data yet.");
  const xs=pts.map((p,i)=>i);const ys=pts.map(p=>p.v);
  let min=Math.min(...ys),max=Math.max(...ys);
  if(opt.target!=null){min=Math.min(min,opt.target);max=Math.max(max,opt.target);}
  if(min===max){min-=1;max+=1;}min-=(max-min)*0.1;max+=(max-min)*0.1;
  const sx=i=>pad+(pts.length<=1?0.5:i/(pts.length-1))*(W-pad*1.4);
  const sy=v=>H-pad-((v-min)/(max-min))*(H-pad*1.6);
  const svg=svgEl(W,H);
  // gridlines
  for(let g=0;g<=3;g++){const y=pad*0.6+g*((H-pad*1.6)/3);svg.appendChild(line(pad,y,W-pad*0.4,y,"gl"));}
  if(opt.target!=null){const ty=sy(opt.target);svg.appendChild(line(pad,ty,W-pad*0.4,ty,"",{stroke:"var(--acc2)","stroke-dasharray":"5 4","stroke-width":"1.5"}));}
  const dpath=pts.map((p,i)=>(i?"L":"M")+sx(i)+" "+sy(p.v)).join(" ");
  svg.appendChild(path(dpath,opt.color||"var(--acc)"));
  pts.forEach((p,i)=>{const c=circle(sx(i),sy(p.v),3,opt.color||"var(--acc)");svg.appendChild(c);});
  svg.appendChild(txt(pad,H-6,pts[0].d.slice(5)));
  if(pts.length>1)svg.appendChild(txt(W-pad*0.4,H-6,pts[pts.length-1].d.slice(5),"end"));
  svg.appendChild(txt(2,sy(max)+4,round(max,1),"start"));
  svg.appendChild(txt(2,sy(min)+4,round(min,1),"start"));
  return svg;
}
function barChart(pts,opt){
  opt=opt||{};const W=620,H=180,pad=24;
  const max=Math.max(1,...pts.map(p=>p.v),opt.target||0);
  const svg=svgEl(W,H);
  const bw=(W-pad*1.4)/pts.length;
  if(opt.target){const ty=H-pad-((opt.target)/max)*(H-pad*1.6);svg.appendChild(line(pad,ty,W-pad*0.4,ty,"",{stroke:"var(--acc2)","stroke-dasharray":"5 4","stroke-width":"1.5"}));}
  pts.forEach((p,i)=>{
    const h=(p.v/max)*(H-pad*1.6);const x=pad+i*bw+bw*0.15;const y=H-pad-h;
    const col=opt.target&&p.v<opt.target*0.9?"var(--warn)":"var(--acc)";
    const r=rect(x,y,bw*0.7,Math.max(0,h),col);svg.appendChild(r);
    if(i%2===0||pts.length<=8)svg.appendChild(txt(x+bw*0.35,H-6,p.d.slice(5),"middle"));
  });
  svg.appendChild(txt(2,pad*0.6+4,round(max),"start"));
  return svg;
}
function svgEl(w,h){const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("viewBox",`0 0 ${w} ${h}`);s.setAttribute("width","100%");s.style.display="block";return s;}
function line(x1,y1,x2,y2,cls,attrs){const l=document.createElementNS("http://www.w3.org/2000/svg","line");l.setAttribute("x1",x1);l.setAttribute("y1",y1);l.setAttribute("x2",x2);l.setAttribute("y2",y2);if(cls)l.setAttribute("class",cls);if(attrs)for(const k in attrs)l.setAttribute(k,attrs[k]);return l;}
function path(d,color){const p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("d",d);p.setAttribute("class","ln");p.setAttribute("stroke",color);return p;}
function circle(cx,cy,r,color){const c=document.createElementNS("http://www.w3.org/2000/svg","circle");c.setAttribute("cx",cx);c.setAttribute("cy",cy);c.setAttribute("r",r);c.setAttribute("fill",color);return c;}
function rect(x,y,w,h,color){const r=document.createElementNS("http://www.w3.org/2000/svg","rect");r.setAttribute("x",x);r.setAttribute("y",y);r.setAttribute("width",w);r.setAttribute("height",h);r.setAttribute("rx",3);r.setAttribute("fill",color);return r;}
function txt(x,y,s,anchor){const t=document.createElementNS("http://www.w3.org/2000/svg","text");t.setAttribute("x",x);t.setAttribute("y",y);if(anchor)t.setAttribute("text-anchor",anchor);t.textContent=s;return t;}

/* ============================================================
   DATA
   ============================================================ */
function viewData(root){
  const c=el("div",{class:"card"});
  c.appendChild(el("h2",null,"Your data"));
  c.appendChild(el("div",{class:"small muted",style:"margin-bottom:10px"},"Everything is stored locally on this device. Export regularly to back up and to move data between phone and laptop."));
  const days=Object.keys(S.workouts).length;const ndays=Object.keys(S.nutrition).length;
  const g=el("div",{class:"grid3"});
  g.append(stat("Body logs",S.bodyLog.length,""),stat("Workout days",days,""),stat("Nutrition days",ndays,""));
  c.appendChild(g);
  const r=el("div",{class:"row",style:"margin-top:12px"});
  const exp=el("button",{class:"btn"},"Export JSON");
  exp.onclick=()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="peaklog-"+todayISO()+".json";a.click();toast("Exported");};
  const imp=el("button",{class:"btn sec"},"Import JSON");
  const file=el("input",{type:"file",accept:"application/json"});file.style.display="none";
  imp.onclick=()=>file.click();
  file.onchange=()=>{const f=file.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o.version)throw 0;if(confirm("Replace all current data with the imported file?")){S=migrate(o);save();render();toast("Imported");}}catch(e){toast("Invalid file");}};rd.readAsText(f);};
  r.append(exp,imp,file);c.appendChild(r);
  const bakKeys=[];
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(KEY+".bak-")===0)bakKeys.push(k);}}catch(e){}
  if(bakKeys.length)c.appendChild(el("div",{class:"small muted",style:"margin-top:10px"},"Safety copies of your data from before each update are kept on this device."));
  bakKeys.sort().forEach(k=>{
    const rev=k.slice(k.indexOf(".bak-")+5);
    const bb=el("button",{class:"btn sm ghost",style:"margin:6px 6px 0 0"},"Download backup · "+rev);
    bb.onclick=()=>{try{const blob=new Blob([localStorage.getItem(k)],{type:"application/json"});
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="peaklog-backup-"+rev+".json";a.click();}catch(e){toast("Backup not available");}};
    c.appendChild(bb);
  });
  root.appendChild(c);

  // baseline reference
  const cb=el("div",{class:"card"});
  cb.appendChild(el("h2",null,"InBody baseline — 10 Jun 2026"));
  const kv=el("div",{class:"kvs"});
  kv.innerHTML=`<span>Weight <b>${BASELINE.weight}kg</b></span><span>Body fat <b>${BASELINE.bodyFat}%</b></span>
  <span>Fat mass <b>${BASELINE.fatMass}kg</b></span><span>Lean (FFM) <b>${BASELINE.ffm}kg</b></span>
  <span>SMM <b>${BASELINE.smm}kg</b></span><span>VFA <b>${BASELINE.vfa}cm²</b></span>
  <span>BMR <b>${BASELINE.bmr}kcal</b></span><span>InBody <b>${BASELINE.score}/100</b></span>`;
  cb.appendChild(kv);
  root.appendChild(cb);

  // workout module — editable InBody baseline (drives the prescriptions)
  root.appendChild(wmInBodyCard());

  // danger
  const cd=el("div",{class:"card"});
  cd.appendChild(el("h2",null,"Reset"));
  const wipe=el("button",{class:"btn bad full"},"Erase all data");
  wipe.onclick=()=>{if(confirm("Delete ALL PeakLog data on this device? Export first if unsure.")){localStorage.removeItem(KEY);S=load();render();toast("Wiped");}};
  cd.appendChild(wipe);
  cd.appendChild(el("div",{class:"hint",style:"margin-top:10px"},"PeakLog v1 • local-first • no account • works offline"));
  root.appendChild(cd);
}

/* ---------- boot ---------- */
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
